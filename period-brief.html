adff\"><\/path>\n            <path d=\"M540,87.4 l7,12 l-14,0 Z\" fill=\"#b7adff\"><\/path>\n            <text x=\"500\" y=\"26\" text-anchor=\"middle\" fill=\"#b7adff\" font-family=\"ui-monospace, Consolas, monospace\" font-size=\"11\">▲ escalation days 7, 8, 10 Jun<\/text>\n            <circle cx=\"360\" cy=\"180.4\" r=\"4.5\" fill=\"none\" stroke=\"#8a8794\" stroke-width=\"1.5\"><\/circle>\n            <circle cx=\"900\" cy=\"255.8\" r=\"4.5\" fill=\"none\" stroke=\"#8a8794\" stroke-width=\"1.5\"><\/circle>\n            <circle cx=\"920\" cy=\"263\" r=\"4.5\" fill=\"none\" stroke=\"#8a8794\" stroke-width=\"1.5\"><\/circle>\n            <line x1=\"360\" y1=\"176\" x2=\"360\" y2=\"140\" stroke=\"#4a4757\" stroke-width=\"1\"><\/line>\n            <text x=\"360\" y=\"132\" text-anchor=\"middle\" fill=\"#8a8794\" font-family=\"ui-monospace, Consolas, monospace\" font-size=\"10.5\">○ 1 Jun · high<\/text>\n            <text x=\"360\" y=\"120\" text-anchor=\"middle\" fill=\"#6f6a86\" font-family=\"ui-monospace, Consolas, monospace\" font-size=\"10\">not rising on a week earlier<\/text>\n            <line x1=\"900\" y1=\"251\" x2=\"880\" y2=\"216\" stroke=\"#4a4757\" stroke-width=\"1\"><\/line>\n            <text x=\"878\" y=\"208\" text-anchor=\"middle\" fill=\"#8a8794\" font-family=\"ui-monospace, Consolas, monospace\" font-size=\"10.5\">○ 28 Jun · high<\/text>\n            <text x=\"878\" y=\"196\" text-anchor=\"middle\" fill=\"#6f6a86\" font-family=\"ui-monospace, Consolas, monospace\" font-size=\"10\">lower than a week earlier<\/text>\n            <line x1=\"920\" y1=\"258\" x2=\"932\" y2=\"238\" stroke=\"#4a4757\" stroke-width=\"1\"><\/line>\n            <text x=\"940\" y=\"230\" text-anchor=\"end\" fill=\"#8a8794\" font-family=\"ui-monospace, Consolas, monospace\" font-size=\"10.5\">○ 29 Jun · high<\/text>\n            <text x=\"940\" y=\"218\" text-anchor=\"end\" fill=\"#6f6a86\" font-family=\"ui-monospace, Consolas, monospace\" font-size=\"10\">not rising on a week earlier<\/text>\n            <line x1=\"520\" y1=\"169\" x2=\"520\" y2=\"200\" stroke=\"#4a4757\" stroke-width=\"1\"><\/line>\n            <text x=\"520\" y=\"213\" text-anchor=\"middle\" fill=\"#8a8794\" font-family=\"ui-monospace, Consolas, monospace\" font-size=\"10.5\">9 Jun · no further rise<\/text>\n            <line x1=\"60\" y1=\"300\" x2=\"940\" y2=\"300\" stroke=\"#3a3a4c\" stroke-width=\"1\"><\/line>\n            <text x=\"60\" y=\"318\" text-anchor=\"middle\" fill=\"#7d7a8c\" font-family=\"ui-monospace, Consolas, monospace\" font-size=\"11\">17 May<\/text>\n            <text x=\"200\" y=\"318\" text-anchor=\"middle\" fill=\"#7d7a8c\" font-family=\"ui-monospace, Consolas, monospace\" font-size=\"11\">24 May<\/text>\n            <text x=\"360\" y=\"318\" text-anchor=\"middle\" fill=\"#7d7a8c\" font-family=\"ui-monospace, Consolas, monospace\" font-size=\"11\">1 Jun<\/text>\n            <text x=\"500\" y=\"318\" text-anchor=\"middle\" fill=\"#7d7a8c\" font-family=\"ui-monospace, Consolas, monospace\" font-size=\"11\">8 Jun<\/text>\n            <text x=\"640\" y=\"318\" text-anchor=\"middle\" fill=\"#7d7a8c\" font-family=\"ui-monospace, Consolas, monospace\" font-size=\"11\">15 Jun<\/text>\n            <text x=\"780\" y=\"318\" text-anchor=\"middle\" fill=\"#7d7a8c\" font-family=\"ui-monospace, Consolas, monospace\" font-size=\"11\">22 Jun<\/text>\n            <text x=\"940\" y=\"318\" text-anchor=\"middle\" fill=\"#7d7a8c\" font-family=\"ui-monospace, Consolas, monospace\" font-size=\"11\">30 Jun<\/text>\n            <g font-family=\"ui-monospace, Consolas, monospace\" font-size=\"11\">\n              <line x1=\"60\" y1=\"368\" x2=\"88\" y2=\"368\" stroke=\"#9184d9\" stroke-width=\"2\"><\/line>\n              <text x=\"96\" y=\"372\" fill=\"#9184d9\">daily event count<\/text>\n              <line x1=\"230\" y1=\"368\" x2=\"258\" y2=\"368\" stroke=\"#6f6a86\" stroke-width=\"1.25\" stroke-dasharray=\"4 3\"><\/line>\n              <text x=\"266\" y=\"372\" fill=\"#8a8794\">usual level<\/text>\n              <text x=\"450\" y=\"372\" fill=\"#b7adff\">▲ escalation day<\/text>\n              <text x=\"610\" y=\"372\" fill=\"#8a8794\">○ high but not rising, not counted<\/text>\n            <\/g>\n          <\/svg><\/div><figcaption style=\"font-size: 14px; line-height: 23px; margin: 10px 0 0; color: #b3acd0;\">Days marked ▲ are the three escalation days. Days marked ○, 1, 28 and 29 June, stand above the usual level but are not rising against the same day a week earlier, and 28 June is lower. Drawn from the platform's daily series for the period.<\/figcaption><\/figure><\/section><section id=\"finding-4\" style=\"max-width: 940px; margin: 0 auto; padding: 96px clamp(20px, 5vw, 56px) 0;\" class=\"pb-body\"><h2 style=\"font-family: var(--font-heading); font-weight: 300; font-size: clamp(26px, 3vw, 34px); line-height: 1.2; letter-spacing: -0.012em; margin: 0 0 14px; padding-bottom: 14px; border-bottom: 1px solid var(--color-neutral-700);\">3. Actors and networks<\/h2><p style=\"font-size: 15.5px; line-height: 26px; margin: 0 0 26px; max-width: 72ch; color: #b8b1d3; font-style: italic;\">The platform resolves who acts, who they act with and against, and which actors hold the network together, across scripts and languages.<\/p><p><strong style=\"font-weight: 500;\">Communities.<\/strong> Of the 6,796 actors named in the period, 2,225 are grouped into 85 communities by the cooperation the reporting records between them. Actors the reporting describes as opposed fall into separate communities in 84.6 percent of known cases. The cooperation links carry no dates, so the communities describe the whole body of reporting rather than the forty-five days alone. The largest community is built around a broadcaster, which shows that the information environment, and not only the fighting, shapes who appears connected to whom. The broadcaster is Iran24, and its community holds 398 actors. The second community forms around the United States, with 388 actors, and the third around Israeli civilians, with 266.<\/p><div style=\"overflow-x: auto; margin: 20px 0 8px; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><sc-raw-table class=\"pb-tbl\" style=\"min-width: 560px; font-family: inherit; font-size: 14.5px;\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Community built around<\/sc-raw-th><sc-raw-th>Actors<\/sc-raw-th><\/sc-raw-tr><\/sc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Iran24, a broadcaster<\/sc-raw-td><sc-raw-td>398<\/sc-raw-td><\/sc-raw-tr><sc-raw-tr><sc-raw-td>The United States<\/sc-raw-td><sc-raw-td>388<\/sc-raw-td><\/sc-raw-tr><sc-raw-tr><sc-raw-td>Israeli civilians<\/sc-raw-td><sc-raw-td>266<\/sc-raw-td><\/sc-raw-tr><sc-raw-tr><sc-raw-td>Israeli military forces<\/sc-raw-td><sc-raw-td>247<\/sc-raw-td><\/sc-raw-tr><sc-raw-tr><sc-raw-td>Hezbollah<\/sc-raw-td><sc-raw-td>146<\/sc-raw-td><\/sc-raw-tr><sc-raw-tr><sc-raw-td>Donald Trump<\/sc-raw-td><sc-raw-td>117<\/sc-raw-td><\/sc-raw-tr><sc-raw-tr><sc-raw-td>Hamas<\/sc-raw-td><sc-raw-td>103<\/sc-raw-td><\/sc-raw-tr><sc-raw-tr><sc-raw-td>The United States military<\/sc-raw-td><sc-raw-td>97<\/sc-raw-td><\/sc-raw-tr><\/sc-raw-tbody><\/sc-raw-table><\/div><div id=\"actors\"><\/div><p><strong style=\"font-weight: 500;\">Actors examined in depth.<\/strong> The platform examines the three actors most involved in the escalation days. The actor detail below comes from the platform's exploratory analysis and indicates direction, not settled findings.<\/p><div style=\"overflow-x: auto; margin: 20px 0 8px; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><sc-raw-table class=\"pb-tbl\" style=\"min-width: 640px; font-family: inherit; font-size: 14.5px;\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Actor<\/sc-raw-th><sc-raw-th>Reported links to events on 7, 8 and 10 June<\/sc-raw-th><sc-raw-th>Examined in depth<\/sc-raw-th><\/sc-raw-tr><\/sc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Israelis<\/sc-raw-td><sc-raw-td>378<\/sc-raw-td><sc-raw-td>No. A collective, not a party whose conduct can be profiled<\/sc-raw-td><\/sc-raw-tr><sc-raw-tr><sc-raw-td>Iran24<\/sc-raw-td><sc-raw-td>322<\/sc-raw-td><sc-raw-td>No. A broadcaster that reports on the conflict<\/sc-raw-td><\/sc-raw-tr><sc-raw-tr><sc-raw-td>The United States<\/sc-raw-td><sc-raw-td>122<\/sc-raw-td><sc-raw-td>Yes<\/sc-raw-td><\/sc-raw-tr><sc-raw-tr><sc-raw-td>Islamic Revolutionary Guard Corps<\/sc-raw-td><sc-raw-td>71<\/sc-raw-td><sc-raw-td>Yes<\/sc-raw-td><\/sc-raw-tr><sc-raw-tr><sc-raw-td>Hezbollah<\/sc-raw-td><sc-raw-td>70<\/sc-raw-td><sc-raw-td>Yes<\/sc-raw-td><\/sc-raw-tr><sc-raw-tr><sc-raw-td>Israeli military forces<\/sc-raw-td><sc-raw-td>54<\/sc-raw-td><sc-raw-td>No<\/sc-raw-td><\/sc-raw-tr><sc-raw-tr><sc-raw-td>Ismaili<\/sc-raw-td><sc-raw-td>49<\/sc-raw-td><sc-raw-td>No. A media outlet<\/sc-raw-td><\/sc-raw-tr><sc-raw-tr><sc-raw-td>Israeli soldier<\/sc-raw-td><sc-raw-td>47<\/sc-raw-td><sc-raw-td>No<\/sc-raw-td><\/sc-raw-tr><\/sc-raw-tbody><\/sc-raw-table><\/div><ul style=\"margin: 0 0 14px; padding-left: 22px; display: grid; gap: 10px; font-size: 17px; line-height: 29px; color: #d6d1ea;\"><li><strong style=\"font-weight: 500;\">Hezbollah.<\/strong> The reporting attributes 902 events to Hezbollah over the period, 91 of them on the three escalation days and on 9 June between them. Its relationship neighbourhood is dominated by alliance links. Of the 50 relationships the platform returns for Hezbollah, 22 are alliances, centred on Iran-linked actors such as the Islamic Revolutionary Guard Corps and Iranian forces, with further alliances recorded with Hamas and with Ansarallah in Yemen.<\/li><li><strong style=\"font-weight: 500;\">The United States.<\/strong> The reporting attributes 831 events, 133 of them on the three escalation days and 100 on 10 June alone, its busiest day of the period. Of the 50 relationships the platform returns for the United States, 33 are alliances, among them Saudi Arabia, Jordan, Bahrain, Kuwait, the United Kingdom, the European Union and the Israeli government.<\/li><li><strong style=\"font-weight: 500;\">The Islamic Revolutionary Guard Corps.<\/strong> The reporting attributes 282 events, 39 of them on 10 June, its busiest day of the period. Of the 50 relationships the platform returns for the Guard Corps, 24 are opposition, aimed chiefly at United States forces and bases in the Gulf and at Jordan, Bahrain and Kuwait.<\/li><\/ul><div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin: 20px 0 8px;\"><figure style=\"margin: 0;\"><img data-src=\"figures/hezbollah__actor__ego_network.png\" alt=\"Hezbollah relationship neighbourhood\" style=\"display: block; width: 100%; height: auto; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><figcaption style=\"font-size: 14px; line-height: 23px; margin: 10px 0 0; color: #b3acd0;\">Hezbollah, recorded relationships<\/figcaption><\/figure><figure style=\"margin: 0;\"><img data-src=\"figures/united_states__actor__ego_network.png\" alt=\"United States relationship neighbourhood\" style=\"display: block; width: 100%; height: auto; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><figcaption style=\"font-size: 14px; line-height: 23px; margin: 10px 0 0; color: #b3acd0;\">The United States, recorded relationships<\/figcaption><\/figure><figure style=\"margin: 0;\"><img data-src=\"figures/irgc__actor__ego_network.png\" alt=\"Islamic Revolutionary Guard Corps relationship neighbourhood\" style=\"display: block; width: 100%; height: auto; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><figcaption style=\"font-size: 14px; line-height: 23px; margin: 10px 0 0; color: #b3acd0;\">The Islamic Revolutionary Guard Corps, recorded relationships<\/figcaption><\/figure><\/div><p>The United States and the Islamic Revolutionary Guard Corps are both busiest on 10 June, inside the escalation, while Hezbollah's busiest day is 19 June, outside it. The Guard Corps' two most serious reported events fall on 17 and 23 June, also outside the escalation, so for that actor the volume of reporting and the seriousness of what it reports do not move together.<\/p><div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin: 20px 0 8px;\"><figure style=\"margin: 0;\"><img data-src=\"figures/hezbollah__profile__entity_timeline.png\" alt=\"Hezbollah daily timeline\" style=\"display: block; width: 100%; height: auto; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><figcaption style=\"font-size: 14px; line-height: 23px; margin: 10px 0 0; color: #b3acd0;\">The timeline counts every event the reporting associates with Hezbollah, a wider measure than the attributed events in the text. By this measure its busiest day is 1 June.<\/figcaption><\/figure><figure style=\"margin: 0;\"><img data-src=\"figures/united_states__profile__entity_timeline.png\" alt=\"United States daily timeline\" style=\"display: block; width: 100%; height: auto; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><figcaption style=\"font-size: 14px; line-height: 23px; margin: 10px 0 0; color: #b3acd0;\">The United States, events per day. Busiest day 10 June.<\/figcaption><\/figure><figure style=\"margin: 0;\"><img data-src=\"figures/irgc__profile__entity_timeline.png\" alt=\"Islamic Revolutionary Guard Corps daily timeline\" style=\"display: block; width: 100%; height: auto; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><figcaption style=\"font-size: 14px; line-height: 23px; margin: 10px 0 0; color: #b3acd0;\">The Islamic Revolutionary Guard Corps, events per day. Busiest day 10 June.<\/figcaption><\/figure><\/div><p><strong style=\"font-weight: 500;\">Influence ranking.<\/strong> Forty-five days of news on a conflict decades old records a relationship only when it is news; standing alliances and enmities are known to every reader and go unwritten. The platform therefore ranks influence for the period by involvement in the escalation itself. With an organisation's own records, which hold the standing relationships, the ranking rests on the full picture.<\/p><\/section><section id=\"finding-2\" style=\"max-width: 940px; margin: 0 auto; padding: 96px clamp(20px, 5vw, 56px) 0;\" class=\"pb-body\"><h2 style=\"font-family: var(--font-heading); font-weight: 300; font-size: clamp(26px, 3vw, 34px); line-height: 1.2; letter-spacing: -0.012em; margin: 0 0 14px; padding-bottom: 14px; border-bottom: 1px solid var(--color-neutral-700);\">4. Narratives<\/h2><p style=\"font-size: 15.5px; line-height: 26px; margin: 0 0 26px; max-width: 72ch; color: #b8b1d3; font-style: italic;\">The platform tracks how each party frames the conflict and dates the moment a framing changes.<\/p><p>Of the narratives the reporting carries through the period, 130 change course. The change dates to 8 June, the middle of the escalation. The changes centre on four subjects. These are the terms of a ceasefire and a United Nations Security Council resolution, claims that the United States took part in strikes on Iran, Iran's stance on negotiations, and threats to close the Strait of Hormuz. The platform dates each change to the turn between the first and second halves of the period, and that turn falls on 8 June. The timing confirms that the framing changed then but does not by itself confirm what each new framing says. About 29 in every 100 changes of this kind are expected to be false signals, so the pattern across the 130 carries more weight than any single one.<\/p><div style=\"overflow-x: auto; margin: 20px 0 8px; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><sc-raw-table class=\"pb-tbl\" style=\"min-width: 600px; font-family: inherit; font-size: 14.5px;\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Subject<\/sc-raw-th><sc-raw-th>A statement from the reporting whose framing changed<\/sc-raw-th><\/sc-raw-tr><\/sc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Ceasefire and a Security Council resolution<\/sc-raw-td><sc-raw-td>The final agreement will be approved by a binding United Nations Security Council resolution.<\/sc-raw-td><\/sc-raw-tr><sc-raw-tr><sc-raw-td>United States part in strikes on Iran<\/sc-raw-td><sc-raw-td>US CENTCOM is participating in attacks carried out against Iran.<\/sc-raw-td><\/sc-raw-tr><sc-raw-tr><sc-raw-td>Iran's stance on negotiations<\/sc-raw-td><sc-raw-td>Iran will not send a delegation to such a meeting.<\/sc-raw-td><\/sc-raw-tr><sc-raw-tr><sc-raw-td>Threats to close the Strait of Hormuz<\/sc-raw-td><sc-raw-td>Disrupting the security of the Strait of Hormuz will have a heavy price for the United States military.<\/sc-raw-td><\/sc-raw-tr><\/sc-raw-tbody><\/sc-raw-table><\/div><figcaption style=\"font-size: 14px; line-height: 23px; margin: 10px 0 0; color: #b3acd0;\">Four of the 130 changed narratives, one per subject, quoted as the reporting carries them. The full list is in the appendix run record.<\/figcaption><\/section><section id=\"finding-3\" style=\"max-width: 940px; margin: 0 auto; padding: 96px clamp(20px, 5vw, 56px) 0;\" class=\"pb-body\"><h2 style=\"font-family: var(--font-heading); font-weight: 300; font-size: clamp(26px, 3vw, 34px); line-height: 1.2; letter-spacing: -0.012em; margin: 0 0 14px; padding-bottom: 14px; border-bottom: 1px solid var(--color-neutral-700);\">5. Geography<\/h2><p style=\"font-size: 15.5px; line-height: 26px; margin: 0 0 26px; max-width: 72ch; color: #b8b1d3; font-style: italic;\">The platform locates activity where the reporting allows and states the share it can place rather than inventing positions.<\/p><p>Activity concentrates in 164 locations over the period. These 164 locations hold 70.8 percent of the events that could be placed on the map. The largest is the Gaza City area, with 666 events across 21 places over the forty-five days. Nineteen locations stay active throughout the period, and four show only a brief rise within a single week, Baghdad, Sinjil, Doha and New York. The New York cluster is the result of a place sharing its name with a location in the region, and the platform identifies it as such instead of reporting it as activity.<\/p><div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 22px 0 8px;\"><div style=\"border: 1px solid var(--color-neutral-700); border-radius: 12px; padding: 16px 18px; background: color-mix(in srgb, var(--color-neutral-800) 45%, transparent);\"><p style=\"font-family: var(--font-heading); font-weight: 300; font-size: 30px; line-height: 38px; margin: 0; color: var(--color-text);\">34.6%<\/p><p style=\"font-size: 14px; line-height: 22px; margin: 6px 0 0; color: #b3acd0;\">of reported events carry a location precise enough to place<\/p><\/div><div style=\"border: 1px solid var(--color-neutral-700); border-radius: 12px; padding: 16px 18px; background: color-mix(in srgb, var(--color-neutral-800) 45%, transparent);\"><p style=\"font-family: var(--font-heading); font-weight: 300; font-size: 30px; line-height: 38px; margin: 0; color: var(--color-text);\">164<\/p><p style=\"font-size: 14px; line-height: 22px; margin: 6px 0 0; color: #b3acd0;\">locations where placed activity concentrates<\/p><\/div><div style=\"border: 1px solid var(--color-neutral-700); border-radius: 12px; padding: 16px 18px; background: color-mix(in srgb, var(--color-neutral-800) 45%, transparent);\"><p style=\"font-family: var(--font-heading); font-weight: 300; font-size: 30px; line-height: 38px; margin: 0; color: var(--color-text);\">70.8%<\/p><p style=\"font-size: 14px; line-height: 22px; margin: 6px 0 0; color: #b3acd0;\">of placed events fall in those locations<\/p><\/div><div style=\"border: 1px solid var(--color-neutral-700); border-radius: 12px; padding: 16px 18px; background: color-mix(in srgb, var(--color-neutral-800) 45%, transparent);\"><p style=\"font-family: var(--font-heading); font-weight: 300; font-size: 30px; line-height: 38px; margin: 0; color: var(--color-text);\">666<\/p><p style=\"font-size: 14px; line-height: 22px; margin: 6px 0 0; color: #b3acd0;\">events in the largest, the Gaza City area<\/p><\/div><\/div><p>Conflict reporting locates many real events only approximately, a missile in an unpopulated area, an object intercepted over a province. The platform counts every such event and places on the map the 34.6 percent the reporting located to a point.<\/p><\/section><section id=\"finding-5\" style=\"max-width: 940px; margin: 0 auto; padding: 96px clamp(20px, 5vw, 56px) 0;\" class=\"pb-body\"><h2 style=\"font-family: var(--font-heading); font-weight: 300; font-size: clamp(26px, 3vw, 34px); line-height: 1.2; letter-spacing: -0.012em; margin: 0 0 14px; padding-bottom: 14px; border-bottom: 1px solid var(--color-neutral-700);\">6. Sources<\/h2><p style=\"font-size: 15.5px; line-height: 26px; margin: 0 0 26px; max-width: 72ch; color: #b8b1d3; font-style: italic;\">The platform grades a source on its own record over the period and grades only where that record exists.<\/p><p>Forty-four sources report on the period. Fifteen have produced a record of statements long enough to be checked against other sources over the period and receive a grade. Six of the graded sources, all Telegram channels, changed grade when the collection of reporting for the period doubled, and each moved toward what its own record shows. Several graded sources sit close to the line between two grades. The other 29 have not produced enough over forty-five days for a grade to mean anything, and for some, including the largest single contributor, the reporting does not tie statements back to the source. The platform says so rather than assigning a grade.<\/p><div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 22px 0 8px;\"><div style=\"border: 1px solid var(--color-neutral-700); border-radius: 12px; padding: 16px 18px; background: color-mix(in srgb, var(--color-neutral-800) 45%, transparent);\"><p style=\"font-family: var(--font-heading); font-weight: 300; font-size: 30px; line-height: 38px; margin: 0; color: var(--color-text);\">44<\/p><p style=\"font-size: 14px; line-height: 22px; margin: 6px 0 0; color: #b3acd0;\">sources reporting on the period<\/p><\/div><div style=\"border: 1px solid var(--color-neutral-700); border-radius: 12px; padding: 16px 18px; background: color-mix(in srgb, var(--color-neutral-800) 45%, transparent);\"><p style=\"font-family: var(--font-heading); font-weight: 300; font-size: 30px; line-height: 38px; margin: 0; color: var(--color-text);\">15<\/p><p style=\"font-size: 14px; line-height: 22px; margin: 6px 0 0; color: #b3acd0;\">graded on their own record<\/p><\/div><div style=\"border: 1px solid var(--color-neutral-700); border-radius: 12px; padding: 16px 18px; background: color-mix(in srgb, var(--color-neutral-800) 45%, transparent);\"><p style=\"font-family: var(--font-heading); font-weight: 300; font-size: 30px; line-height: 38px; margin: 0; color: var(--color-text);\">29<\/p><p style=\"font-size: 14px; line-height: 22px; margin: 6px 0 0; color: #b3acd0;\">not yet gradeable, and left ungraded<\/p><\/div><div style=\"border: 1px solid var(--color-neutral-700); border-radius: 12px; padding: 16px 18px; background: color-mix(in srgb, var(--color-neutral-800) 45%, transparent);\"><p style=\"font-family: var(--font-heading); font-weight: 300; font-size: 30px; line-height: 38px; margin: 0; color: var(--color-text);\">6<\/p><p style=\"font-size: 14px; line-height: 22px; margin: 6px 0 0; color: #b3acd0;\">graded Telegram channels that changed grade<\/p><\/div><\/div><figcaption style=\"font-size: 14px; line-height: 23px; margin: 10px 0 0; color: #b3acd0;\">The six channels that changed grade are Abu Ali Express, Geopol Watch, Middle East Spectator, Quds News, The Cradle and Warfare Analysis.<\/figcaption><\/section><section id=\"received\" style=\"max-width: 940px; margin: 0 auto; padding: 96px clamp(20px, 5vw, 56px) 0;\" class=\"pb-body\"><h2 style=\"font-family: var(--font-heading); font-weight: 300; font-size: clamp(26px, 3vw, 34px); line-height: 1.2; letter-spacing: -0.012em; margin: 0 0 14px; padding-bottom: 14px; border-bottom: 1px solid var(--color-neutral-700);\">7. What the platform received<\/h2><p>The platform reads 27,461 events, 41,390 claims and 6,796 actors from open and primary reporting covering the period, with no day missing.<\/p><\/section><section id=\"appendix\" style=\"max-width: 1060px; margin: 0 auto; padding: 96px clamp(20px, 5vw, 56px) 0;\" class=\"pb-app\"><h2 style=\"font-family: var(--font-heading); font-weight: 300; font-size: clamp(26px, 3vw, 34px); line-height: 1.2; letter-spacing: -0.012em; margin: 0 0 14px; padding-bottom: 14px; border-bottom: 1px solid var(--color-neutral-700);\">Appendix. Methods and checks<\/h2><div id=\"how\"><\/div><p style=\"font-size: 16px; line-height: 27px; margin: 0 0 14px; max-width: 72ch; color: #cfc9e6;\">The findings above were produced under a stated quality standard adopted before the results were seen.<\/p><ul style=\"margin: 0; padding-left: 22px; display: grid; gap: 8px; font-size: 15.5px; line-height: 26px; color: #d6d1ea; max-width: 80ch;\"><li>The design and acceptance standard for the period were written on 30 August, before the corpus was expanded.<\/li><li>The corpus was doubled from the earlier sample and the six capabilities were recalibrated on it. The changes from the earlier calibration are published beside the results.<\/li><li>Escalation. Three days flagged with peak intensity at 7.69 standard units; 9 June at 1.55; 1, 28 and 29 June above the level bar but rejected on the acceleration test, week-over-week ratios 1.18, 0.87 and 1.08; no day rejected on source composition.<\/li><li>Actor influence. Completeness 0.2064 against a standard of 0.5, ranking by escalation involvement adopted in its place; edge counts at selection, United States 122, IRGC 71, Hezbollah 70.<\/li><li>Communities. Modularity 0.7238.<\/li><li>Geography. 164 hotspots, capture share 0.7084, 34.6 percent of events placed.<\/li><li>Sources. 15 of 44 graded, 10.5 percent of statement history attributable.<\/li><li>Narratives. 130 of 261 admitted, false-discovery share 0.29, boundary dated 8 June.<\/li><li>Independent checks. A blind check of twenty items on the first round found one error, which was corrected. A second round of twenty on a fresh sample passed in full. A check of the 29 statements new to this edition, recomputed against the run record on 28 September, found no errors.<\/li><li>Of the platform's AI assistant's draft statements, 21 were replaced and 8 corrected, one of which was a detail the model had invented; the replaced text was published alongside the correction.<\/li><li>Ship checks. All six signed on 2 September.<\/li><\/ul><div id=\"delta\" style=\" padding: 44px 0 0;\">\n    <h2 style=\"font-family: var(--font-heading); font-weight: 300; font-size: clamp(24px, 2.6vw, 30px); line-height: 1.2; letter-spacing: -0.012em; margin: 0 0 8px; padding-bottom: 14px; border-bottom: 1px solid var(--color-neutral-700);\">Delta table — original vs expanded corpus<\/h2>\n    <p style=\"font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; line-height: 21px; margin: 14px 0 0; color: #9c95bd;\">ACCEPTANCE_RULE §C template, unedited, misses included. One row per calibrated capability. Original = 45-day window, corpus as of 23 Aug (11,189 events). Expanded = same window, same frozen rules, corpus as of 31 Aug (27,461 events). Run date 2026-08-31; journals <code>*_sweep_004/006/003/003/002/002<\/code> per row.<\/p>\n    <div style=\"overflow-x: auto; margin: 24px 0 0; border: 1px solid var(--color-neutral-700); border-radius: 12px;\">\n      <sc-raw-table class=\"pb-tbl\">\n        <sc-raw-thead>\n          <sc-raw-tr><sc-raw-th>Capability<\/sc-raw-th><sc-raw-th>Metric<\/sc-raw-th><sc-raw-th>Floor<\/sc-raw-th><sc-raw-th>Original (45-day window, corpus as of 23 Aug)<\/sc-raw-th><sc-raw-th>Expanded corpus<\/sc-raw-th><sc-raw-th>Delta<\/sc-raw-th><sc-raw-th>Meets floor?<\/sc-raw-th><\/sc-raw-tr>\n        <\/sc-raw-thead>\n        <sc-raw-tbody>\n          <sc-raw-tr><sc-raw-td>escalation_detection<\/sc-raw-td><sc-raw-td>coverage<\/sc-raw-td><sc-raw-td>0.75<\/sc-raw-td><sc-raw-td>1.0 (3 days flagged: 7, 8, 9 Jun)<\/sc-raw-td><sc-raw-td>1.0 (3 days flagged: <strong>7, 8, 10 Jun<\/strong>)<\/sc-raw-td><sc-raw-td>0.0 (flagged set changed: 9 Jun out, 10 Jun in)<\/sc-raw-td><sc-raw-td><strong>Yes<\/strong><\/sc-raw-td><\/sc-raw-tr>\n          <sc-raw-tr><sc-raw-td>actor_centrality_ranking<\/sc-raw-td><sc-raw-td>completeness<\/sc-raw-td><sc-raw-td>0.5<\/sc-raw-td><sc-raw-td>0.1997 (592 of 2,965)<\/sc-raw-td><sc-raw-td>0.2065 (1,403 of 6,796)<\/sc-raw-td><sc-raw-td>+0.0068<\/sc-raw-td><sc-raw-td style=\"color: #ff8b8f;\"><strong>No — below bar, worked example only<\/strong><\/sc-raw-td><\/sc-raw-tr>\n          <sc-raw-tr><sc-raw-td>actor_network_clustering<\/sc-raw-td><sc-raw-td>modularity<\/sc-raw-td><sc-raw-td>0.3 min<\/sc-raw-td><sc-raw-td>0.7366 (48 clusters / 982 actors)<\/sc-raw-td><sc-raw-td>0.7238 (85 clusters / 2,225 actors)<\/sc-raw-td><sc-raw-td>−0.0128<\/sc-raw-td><sc-raw-td><strong>Yes<\/strong><\/sc-raw-td><\/sc-raw-tr>\n          <sc-raw-tr><sc-raw-td>geospatial_hotspot_analysis<\/sc-raw-td><sc-raw-td>capture share<\/sc-raw-td><sc-raw-td>—<\/sc-raw-td><sc-raw-td>0.6721 (88 hotspots / 5,160 plottable)<\/sc-raw-td><sc-raw-td>0.7084 (164 hotspots / 9,156 plottable)<\/sc-raw-td><sc-raw-td>+0.0363<\/sc-raw-td><sc-raw-td>— (no floor)<\/sc-raw-td><\/sc-raw-tr>\n          <sc-raw-tr><sc-raw-td>source_reliability_audit<\/sc-raw-td><sc-raw-td>attributable share<\/sc-raw-td><sc-raw-td>—<\/sc-raw-td><sc-raw-td>11.6% (15 of 44 sources)<\/sc-raw-td><sc-raw-td>10.5% (15 of 44 sources; 41,390 of 394,233 assertions)<\/sc-raw-td><sc-raw-td>−1.1 pp<\/sc-raw-td><sc-raw-td>— (no floor)<\/sc-raw-td><\/sc-raw-tr>\n          <sc-raw-tr><sc-raw-td>narrative_shift_detection<\/sc-raw-td><sc-raw-td>confidence / FDR<\/sc-raw-td><sc-raw-td>— (signal test)<\/sc-raw-td><sc-raw-td>0.517 / ~0.42 (69 of 573)<\/sc-raw-td><sc-raw-td>0.6085 / 0.290 (261 of 1,515)<\/sc-raw-td><sc-raw-td>+0.092 conf / −0.13 FDR<\/sc-raw-td><sc-raw-td><strong>Yes — signal test passed<\/strong><\/sc-raw-td><\/sc-raw-tr>\n        <\/sc-raw-tbody>\n      <\/sc-raw-table>\n    <\/div>\n\n    <h3 style=\"font-family: var(--font-heading); font-weight: 300; font-size: 19px; line-height: 28px; margin: 40px 0 16px;\">Also recorded (per §C)<\/h3>\n    <div style=\"display: grid; gap: 18px; max-width: 76ch; font-size: 15.5px; line-height: 26px; color: #bdb7d6;\">\n      <p style=\"margin: 0;\"><strong style=\"font-weight: 500;\">Corpus size before/after:<\/strong> 11,189 → 27,461 events (deleted=0); 16,067 → 41,390 claims; 2,965 → 6,796 actors. Expanded ingestion completed 2026-08-31.<\/p>\n      <div>\n        <p style=\"margin: 0 0 10px;\"><strong style=\"font-weight: 500;\">Capabilities that moved across a floor:<\/strong> none. Every capability sits on the same side of its floor as on the original pass. The two changes worth a sentence in “how this was made”:<\/p>\n        <ol style=\"margin: 0; padding-left: 22px; display: grid; gap: 8px;\">\n          <li>escalation_detection kept coverage 1.0 but its flagged-day set changed — 9 Jun (robust-z 1.55 on the doubled corpus) no longer clears the bar; 10 Jun (z 2.79) does. The episode reads as 7–10 Jun with an interior dip.<\/li>\n          <li>geospatial capture share rose while the plottable denominator collapsed (50.7% → 34.6% of window events plottable) — the map concentrates better but speaks for a third of the window, not half.<\/li>\n        <\/ol>\n      <\/div>\n      <p style=\"margin: 0;\"><strong style=\"font-weight: 500;\">Parameter shifts under the same rules (disclosed, not floor-relevant):<\/strong> source_reliability's stability rule selected prior 160 (was 80); narrative_shift's rule re-selected the 22-day window; clustering re-selected <code>tiered_max<\/code> at resolution 0.75; escalation and centrality re-selected their original parameterisations.<\/p>\n    <\/div>\n  <div style=\"display: grid; gap: 10px; max-width: 76ch; font-size: 15px; line-height: 25px; color: #bdb7d6; margin: 22px 0 0; padding: 14px 18px; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><p style=\"margin: 0;\"><strong style=\"font-weight: 500;\">Corrections, 28 September 2026.<\/strong> The table and notes above are left as published.<\/p><p style=\"margin: 0;\">Centrality completeness on the expanded corpus is 0.2064, not 0.2065 (1,403 of 6,796 = 0.20644); the delta against the original is +0.0067.<\/p><p style=\"margin: 0;\">\"Escalation and centrality re-selected their original parameterisations\" is incorrect for both. Escalation moved from a 21-day to a 7-day baseline, with the same thresholds; centrality moved from the betweenness-led blend to the equal blend, with the same type weighting and method.<\/p><p style=\"margin: 0;\">Since 28 September the platform itself runs these same calibrations on this corpus (configurations 7 to 9).<\/p><\/div><\/div><h3 style=\"font-family: var(--font-heading); font-weight: 300; font-size: 21px; line-height: 30px; margin: 44px 0 14px;\">The same results in the platform's analyst workspace<\/h3><p style=\"font-size: 15px; line-height: 25px; margin: 0; max-width: 76ch; color: #b8b1d3;\">Captured on 28 September 2026 from the analyst workspace, run on the 31 August snapshot this brief was built on.<\/p><div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin: 20px 0 8px;\"><figure style=\"margin: 0;\"><img data-src=\"captures-2026-09-28/01_escalation_detection.png\" alt=\"Escalation detection in the analyst workspace\" style=\"display: block; width: 100%; height: auto; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><figcaption style=\"font-size: 14px; line-height: 23px; margin: 10px 0 0; color: #b3acd0;\">Escalation detection<\/figcaption><\/figure><figure style=\"margin: 0;\"><img data-src=\"captures-2026-09-28/02_geospatial_hotspot_analysis.png\" alt=\"Hotspot analysis in the analyst workspace\" style=\"display: block; width: 100%; height: auto; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><figcaption style=\"font-size: 14px; line-height: 23px; margin: 10px 0 0; color: #b3acd0;\">Geospatial hotspots<\/figcaption><\/figure><figure style=\"margin: 0;\"><img data-src=\"captures-2026-09-28/03_source_reliability_audit.png\" alt=\"Source reliability audit in the analyst workspace\" style=\"display: block; width: 100%; height: auto; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><figcaption style=\"font-size: 14px; line-height: 23px; margin: 10px 0 0; color: #b3acd0;\">Source reliability<\/figcaption><\/figure><figure style=\"margin: 0;\"><img data-src=\"captures-2026-09-28/04_narrative_shift_detection.png\" alt=\"Narrative shift detection in the analyst workspace\" style=\"display: block; width: 100%; height: auto; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><figcaption style=\"font-size: 14px; line-height: 23px; margin: 10px 0 0; color: #b3acd0;\">Narrative shifts<\/figcaption><\/figure><figure style=\"margin: 0;\"><img data-src=\"captures-2026-09-28/05_actor_network_clustering.png\" alt=\"Actor network clustering in the analyst workspace\" style=\"display: block; width: 100%; height: auto; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><figcaption style=\"font-size: 14px; line-height: 23px; margin: 10px 0 0; color: #b3acd0;\">Actor communities<\/figcaption><\/figure><\/div><h3 style=\"font-family: var(--font-heading); font-weight: 300; font-size: 21px; line-height: 30px; margin: 44px 0 14px;\">Attributed events for the three actors<\/h3><p style=\"font-size: 15px; line-height: 25px; margin: 0; max-width: 76ch; color: #b8b1d3;\">Tables of the events the reporting attributes to each actor, from the full-period data. Each table shows its first 25 rows; the full data is in the run record.<\/p><div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin: 20px 0 8px;\"><figure style=\"margin: 0;\"><img data-src=\"figures/hezbollah__attribution__actor_responsibility_full.png\" alt=\"Hezbollah attributed events table\" style=\"display: block; width: 100%; height: auto; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><figcaption style=\"font-size: 14px; line-height: 23px; margin: 10px 0 0; color: #b3acd0;\">Hezbollah, first 25 of 902 attributed events<\/figcaption><\/figure><figure style=\"margin: 0;\"><img data-src=\"figures/united_states__attribution__actor_responsibility_full.png\" alt=\"United States attributed events table\" style=\"display: block; width: 100%; height: auto; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><figcaption style=\"font-size: 14px; line-height: 23px; margin: 10px 0 0; color: #b3acd0;\">The United States, first 25 of 831 attributed events<\/figcaption><\/figure><figure style=\"margin: 0;\"><img data-src=\"figures/irgc__attribution__actor_responsibility.png\" alt=\"Islamic Revolutionary Guard Corps attributed events table\" style=\"display: block; width: 100%; height: auto; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><figcaption style=\"font-size: 14px; line-height: 23px; margin: 10px 0 0; color: #b3acd0;\">The Islamic Revolutionary Guard Corps, first 25 of 282 attributed events<\/figcaption><\/figure><\/div><h3 style=\"font-family: var(--font-heading); font-weight: 300; font-size: 21px; line-height: 30px; margin: 44px 0 14px;\">Every method readout<\/h3><p style=\"font-size: 15.5px; line-height: 26px; margin: 0 0 28px; max-width: 70ch; color: #b8b1d3;\">Tier A methods are calibrated: pre-registered thresholds, immutable sweep journals. Tier B ran in the same sweep but is uncalibrated, directional only, and supports no finding above. Figures were rendered mechanically from the saved run output; tables in figures cap at 25 rows. Readouts are published as run; the 28 September corrections noted under the delta table apply to them.<\/p><h3 style=\"font-family: ui-monospace, Consolas, monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent); margin: 0 0 14px;\">Tier A · calibrated capabilities<\/h3>\n\n    <details>\n      <summary>escalation_detection <span class=\"pb-tier-a\">Tier A · calibrated<\/span><\/summary>\n      <div style=\"padding: 16px; font-size: 14.5px; line-height: 25px; color: #cfc9e6;\">\n        <p style=\"margin: 0 0 12px;\">Metric coverage 1.0 against a pre-registered floor of 0.75 — met. 26,464 events in window; 38 evaluable days; escalation rate 0.0789; max robust-z 7.6892. Flagged: 7, 8, 10 June. Level anomalies: 1, 7, 8, 10, 28, 29 June. Composition-rejected: none. Chosen parameters: baseline window 7 days, anomaly flag threshold 2.5, acceleration threshold 1.5. Established cohort: first half.<\/p>\n        <div class=\"pb-ro\"><p class=\"pb-ro-k\">Calibration readout · verbatim<\/p><p><strong>Journal:<\/strong> <code>reports/calibration/escalation_detection_sweep_004.json<\/code> · <code>data_as_of<\/code> 2026-08-31T03:32:37.841686+00:00. <strong>Window:<\/strong> 2026-05-17 → 2026-06-30 (45 days, 26,464 sourced events). <strong>Thresholds frozen:<\/strong> rule pre-registered in <code>escalation_detection_sweep_003<\/code> (cal_2/#1004), re-adopted verbatim at 2026-08-31T19:43Z in <code>thresholds_frozen.md<\/code>, before this sweep ran.<\/p><p>Chosen parameters on the expanded corpus: baseline 7 days, robust-z threshold 2.5, acceleration 1.5 (the published pair; same selection rule, re-fit honestly). 3 escalation days of 38 evaluable (rate 0.079); max robust-z 7.69 (2026-06-07); composition control rejected no day; boundary-tail check: the 27–30 Jun tail did not read as escalation under any cohort definition.<\/p><h5>The one flagged-day change, stated plainly<\/h5><p>The original pass flagged 9 Jun; the expanded corpus flags <strong>10 Jun<\/strong> instead. On the doubled corpus 9 Jun (816 events, robust-z 1.55) no longer clears the level-anomaly bar against its own trailing baseline, while 10 Jun (1,048 events, robust-z 2.79, week-over-week 1.65) does. The escalation episode reads as 7–10 Jun with an interior dip on 9 Jun.<\/p><h5>rejected_days — high-z days the published rule did not flag<\/h5><p>Three days clear the robust-z 2.5 level threshold but are not escalations. Read from <code>escalation_detection_sweep_004.json<\/code> (chosen parameters): each appears in <code>anomaly_dates<\/code>, none in <code>escalation_dates<\/code>, and <code>composition_rejected_dates<\/code> is empty — so the rejecting gate is <strong>acceleration<\/strong> for all three. The sweep grid confirms it: no target day becomes an escalation even at the loosest grid <code>acceleration_threshold<\/code> of 1.25. The failing statistic is the rule’s own <code>growth_ratio = count_t / count_{t-7}<\/code> (same weekday one week earlier), computed from the published timeseries counts:<\/p><div style=\"overflow-x:auto; margin: 0 0 10px;\"><sc-raw-table class=\"pb-tbl\" style=\"min-width:520px\"><sc-raw-thead><sc-raw-tr><sc-raw-th>date<\/sc-raw-th><sc-raw-th>robust_z<\/sc-raw-th><sc-raw-th>rejecting criterion<\/sc-raw-th><sc-raw-th>failing value<\/sc-raw-th><sc-raw-th>arithmetic<\/sc-raw-th><\/sc-raw-tr><\/sc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>2026-06-01<\/sc-raw-td><sc-raw-td>4.48<\/sc-raw-td><sc-raw-td>acceleration &lt; 1.5<\/sc-raw-td><sc-raw-td>growth_ratio <strong>1.18<\/strong><\/sc-raw-td><sc-raw-td>764 / 650 (vs 25 May)<\/sc-raw-td><\/sc-raw-tr><sc-raw-tr><sc-raw-td>2026-06-28<\/sc-raw-td><sc-raw-td>5.06<\/sc-raw-td><sc-raw-td>acceleration &lt; 1.5<\/sc-raw-td><sc-raw-td>growth_ratio <strong>0.87<\/strong><\/sc-raw-td><sc-raw-td>503 / 579 (vs 21 Jun) — declined week-over-week<\/sc-raw-td><\/sc-raw-tr><sc-raw-tr><sc-raw-td>2026-06-29<\/sc-raw-td><sc-raw-td>2.95<\/sc-raw-td><sc-raw-td>acceleration &lt; 1.5<\/sc-raw-td><sc-raw-td>growth_ratio <strong>1.08<\/strong><\/sc-raw-td><sc-raw-td>478 / 443 (vs 22 Jun)<\/sc-raw-td><\/sc-raw-tr><\/sc-raw-tbody><\/sc-raw-table><\/div><p>Reading: 1 Jun and 28–29 Jun were level-anomalous against their trailing 7-day baselines but were not <em>rising<\/em> week-over-week — the rule alerts on the rising edge of an episode, not on elevated plateaus or post-drop rebounds.<\/p><p class=\"pb-ro-d\">Caveats carried: <code>snapshot_data<\/code> (data_as_of above); a flagged day is a day whose reporting volume behaved like escalation on this corpus — a change in who is reporting is not a change in the world (composition control enforced); nothing after 2026-06-30 — coverage stops there.<\/p><\/div><div style=\"height:14px\"><\/div><p style=\"margin: 0;\"><span class=\"pb-chip\">escalation_detection · 2026-08-31 · escalation_detection_sweep_004 · coverage 1.0 · Tier A<\/span><\/p>\n      <\/div>\n    <\/details>\n\n    <details>\n      <summary>actor_centrality_ranking <span class=\"pb-tier-a\" style=\"background: rgba(229,72,77,.16); color: #ff8b8f;\">Tier A · below its own bar<\/span><\/summary>\n      <div style=\"padding: 16px; font-size: 14.5px; line-height: 25px; color: #cfc9e6;\">\n        <div style=\"border: 1px solid rgba(229,72,77,.38); border-radius: 12px; padding: 14px 16px; margin: 0 0 14px; background: rgba(229,72,77,.06);\">\n          <p style=\"margin: 0; font-size: 14.5px; line-height: 25px;\"><span style=\"color: #ff8b8f;\">⚠<\/span> Relationship completeness 0.2065 against a 0.5 floor — not met. Status: below bar — worked example only (rule A3). Published as measured; excluded from the findings.<\/p>\n        <\/div>\n        <p style=\"margin: 0 0 12px;\">1,403 actors ranked of 6,796. Robustness (Spearman) 0.9684. Hostility guard passed; opposed share in top N 0.4107 against a 0.44 reference. Role counts: 141 hub, 40 bridge, 521 connected, 701 peripheral. Top 10: United States, Iran24, Israeli military maneuvering forces, Hezbollah, Israeli soldier, Donald Trump, Ismaili, Islamic Revolutionary Guard Corps, Hamas, Lebanon.<\/p>\n        <div class=\"pb-ro\"><p class=\"pb-ro-k\">Calibration readout · verbatim<\/p><p><strong>Journal:<\/strong> <code>reports/calibration/actor_centrality_ranking_sweep_006.json<\/code> · <code>data_as_of<\/code> 2026-08-31T03:32:37.841686+00:00. <strong>Thresholds frozen:<\/strong> rule pre-registered in <code>actor_centrality_ranking_sweep_005<\/code> (cal_3 re-fit/#1056, DEC-340 eligibility), re-adopted verbatim at 2026-08-31T19:43Z, before this sweep ran. Metric: relationship completeness <strong>0.2065<\/strong> (1,403 of 6,796 actors meet the ≥2-relationship-type eligibility bar) against a pre-registered floor of 0.5 — <strong>not met<\/strong>, published as the worked example of a capability below its own bar (rule A3). Confidence: window-grounded robustness (Spearman) 0.9684.<\/p><p>Doubling the corpus barely moved completeness (0.1997 → 0.2065): the expanded ingestion added actors and relationships in the same proportion, so four out of five known actors still carry too few relationship types to rank. The fitted blend re-selected the same parameterisation (uniform type-weighting, equal blend, weighted average), cleared the hostility guard (41.1% OPPOSED_TO among top-20 incident edges vs 44.0% for an explicit hostility ranking), and held robustness 0.9684.<\/p><p>Top of the ranking (worked example, not a network claim): United States 0.980, Iran24 0.868, Israeli military maneuvering forces 0.304, Hezbollah 0.281, Israeli soldier 0.248, Donald Trump 0.229 — 141 hubs, 40 bridges, 521 connected, 701 peripheral.<\/p><p><strong>Consequence for this run (rule A3):<\/strong> deep-dive actors were NOT chosen by centrality. See <code>actor_selection.md<\/code>.<\/p><p class=\"pb-ro-d\">Caveats carried: <code>snapshot_data<\/code>; <code>relationship_completeness_below_floor<\/code>; <code>undated_relationships<\/code> — the ranking describes the materialised network, not the window’s.<\/p><\/div><div style=\"height:14px\"><\/div><p style=\"margin: 0;\"><span class=\"pb-chip\">actor_centrality_ranking · 2026-08-31 · actor_centrality_ranking_sweep_006 · completeness 0.2065 (floor 0.5, NOT met — below bar) · Tier A<\/span><\/p>\n      <\/div>\n    <\/details>\n\n    <details>\n      <summary>actor_network_clustering <span class=\"pb-tier-a\">Tier A · calibrated<\/span><\/summary>\n      <div style=\"padding: 16px; font-size: 14.5px; line-height: 25px; color: #cfc9e6;\">\n        <p style=\"margin: 0 0 12px;\">Modularity 0.723786 against a 0.3 floor — met. 85 clusters over 2,225 clustered actors; 2,591 actors in graph, 366 unclustered; 5,542 relationships. Adversarial separation 0.846076. Largest cluster share 0.178876. Chosen parameters: coordination edge set, tiered_max weighting, resolution 0.75. Top clusters: Iran24 network (398), United States network (388), Israelis network (266), Israeli military maneuvering forces network (247), Hezbollah network (146), Donald Trump network (117), Hamas network (103), United States military network (97). The coordination graph's edges are undated, so this is the materialised network, not a window's.<\/p>\n        <div class=\"pb-ro\"><p class=\"pb-ro-k\">Calibration readout · verbatim<\/p><p><strong>Journal:<\/strong> <code>reports/calibration/actor_network_clustering_sweep_003.json<\/code> · <code>data_as_of<\/code> 2026-08-31T03:32:37.841686+00:00. <strong>Thresholds frozen:<\/strong> rule pre-registered in <code>actor_network_clustering_sweep_002<\/code> (cal_4/#1006), re-adopted verbatim at 2026-08-31T19:43Z, before this sweep ran. Metric: modularity <strong>0.7238<\/strong> at resolution-1.0 evaluation against a 0.30 minimum — met. Confidence: adversarial separation 0.8461 (share of held-out OPPOSED_TO pairs falling between clusters).<\/p><p>The same rule (primary coordination arm only; three admissibility gates) chose <code>tiered_max<\/code> weighting at Louvain resolution 0.75 over 5,542 coordination relationships. The partition scaled with the corpus — 85 communities against 48 — while modularity held within 0.013 of the original and the largest cluster holds 17.9% of clustered actors. Coordination stayed distinct from opposition: 84.6% of known opposed pairs land in different clusters (1,671 of 1,975 evaluable).<\/p><p>The top communities read as a person would name them: Iran24 network (398), United States network (388), Israelis network (266), Israeli military network (247), Hezbollah network (146), Trump network (117), Hamas network (103), US military network (97). 161 bridge actors; the highest-betweenness bridges are coarse collectives (“Israelis”, “Iran24”, “United States”) — kept by rule, since DEC-340’s eligibility narrowing binds the centrality ranking, not this partition.<\/p><p class=\"pb-ro-d\">Caveats carried: <code>snapshot_data<\/code>; <code>undated_relationships<\/code> — the coordination edges carry no dates, so this is the materialised network of the whole corpus, not the window’s; a partition is structure over reported co-ordination, not an org chart.<\/p><\/div><div style=\"height:14px\"><\/div><p style=\"margin: 0;\"><span class=\"pb-chip\">actor_network_clustering · 2026-08-31 · actor_network_clustering_sweep_003 · modularity 0.7238 (floor 0.30, met) · Tier A<\/span><\/p>\n      <\/div>\n    <\/details>\n\n    <details>\n      <summary>geospatial_hotspot_analysis <span class=\"pb-tier-a\">Tier A · calibrated<\/span><\/summary>\n      <div style=\"padding: 16px; font-size: 14.5px; line-height: 25px; color: #cfc9e6;\">\n        <p style=\"margin: 0 0 12px;\">Capture share 0.7084 — 6,486 of 9,156 plottable events captured inside 164 hotspots; no pre-registered floor. 26,464 events in window; 13,891 located at events; 9,156 plottable (34.6%); 4,735 named but uncoordinated. Bandwidth 2.0 km; minimum 10 events per cluster; intensity floor 0.21969 events per day. 306 of 1,528 places lit. 19 persistent hotspots, 4 spike hotspots, 14 spikes suppressed by the volume guard, 0 composition-driven. Largest hotspot: Gaza City, Israel (general), Israel — 666 events. Spike examples: Baghdad 2.73x, New York 2.57x, Sinjil 3.38x, Doha 3.03x. Confidence: KS statistic 0.5081.<\/p>\n        <div class=\"pb-ro\"><p class=\"pb-ro-k\">Calibration readout · verbatim<\/p><p><strong>Journal:<\/strong> <code>reports/calibration/geospatial_hotspot_sweep_003.json<\/code> · <code>data_as_of<\/code> 2026-08-31T03:32:37.841686+00:00. <strong>Window:<\/strong> 2026-05-17 → 2026-06-30 (45 days). <strong>Thresholds frozen:<\/strong> rule pre-registered in <code>geospatial_hotspot_sweep_002<\/code> (cal_6/#1008), re-adopted verbatim at 2026-08-31T19:43Z, before this sweep ran. Metric: capture share <strong>0.7084<\/strong> (6,486 of 9,156 plottable events inside a hotspot); no pre-registered floor — capture share reported, not gated. Confidence: KS concentration separation 0.5081.<\/p><p>Coverage, three numbers, not one (cal_5/DEC-332 single denominator): of 26,464 window events, 13,891 (52.5%) carried a LOCATED_AT edge, <strong>9,156 (34.6%) were plottable<\/strong>, and 4,735 (17.9%) were named-but-uncoordinated. The same rule chose the same bandwidth (2.0 km); the intensity floor scaled with the corpus (0.220 events/day, min 10 events per cluster). 19 hotspots read as persistent, 4 as spikes (Baghdad 2.73×, New York 2.57×, Sinjil 3.38×, Doha 3.03×), 14 spike candidates were suppressed by the volume guard, and 0 hotspots were composition-driven — no late-entrant source carried any of it. The largest hotspot (Gaza City area, 666 events) held 7.3% of captured events; median hotspot 13–14 events.<\/p><h5>The number that moved against the corpus<\/h5><p>Plottable share fell 50.7% → 34.6%. The backfill more than doubled de> (cal_8/#1010), re-adopted verbatim at 2026-08-31T19:43Z, before this sweep ran. Metric: attributable share <strong>10.5%<\/strong> — 41,390 claim-cohort assertions of 394,233 total; <strong>15 of 44<\/strong> declared sources reached; no pre-registered floor — cohort share is reported, not gated. Confidence: mean shrinkage weight 0.7339 (prior still carries ~73% of every score).<\/p><p>The stability rule (smallest prior pseudo-count unchanged under doubling) selected <strong>prior_pseudo_count 160<\/strong> on the expanded corpus, versus 80 on the original — with roughly 2.5× the evidence, tier assignments only stabilise under a stronger prior, because six sources now sit near tier boundaries. 12 sources carry direct verification evidence (largest: the_cradle_tg 286, geopol_watch_tg 148, saberin_tg 114); 6 outliers flagged; 6 provisional tier changes (all Telegram-cohort sources, all toward the evidence and away from the bootstrap): abu_ali_express_tg, geopol_watch_tg, middle_east_spectator_tg, quds_news_tg, the_cradle_tg, warfare_analysis_tg. Delta stdev 0.0747.<\/p><h5>What it cannot claim<\/h5><p>A ranking of the corpus’s sources. It scores the minority that <code>Claim-MADE_BY-&gt;Source<\/code> attribution reaches (CAC-013); <code>gdelt<\/code> — the corpus’s largest single contributor — and the wire/aggregate cohort keep their bootstrap values untouched, and the audit says so rather than filling the gap with a default that would read as a score.<\/p><p class=\"pb-ro-d\">Caveats carried: <code>snapshot_data<\/code> (data_as_of above); <code>attribution_cohort<\/code> (the audit speaks for 10.5% of the assertion history); scores are Bayesian-shrunk posteriors, not observed accuracy rates.<\/p><\/div><div style=\"height:14px\"><\/div><p style=\"margin: 0;\"><span class=\"pb-chip\">source_reliability_audit · 2026-08-31 · source_reliability_audit_sweep_002 · attributable share 10.5% (cohort-limited) · Tier A<\/span><\/p>\n      <\/div>\n    <\/details>\n\n    <details>\n      <summary>narrative_shift_detection <span class=\"pb-tier-a\">Tier A · calibrated<\/span><\/summary>\n      <div style=\"padding: 16px; font-size: 14.5px; line-height: 25px; color: #cfc9e6;\">\n        <p style=\"margin: 0 0 12px;\">Mean confidence of detected 0.6085; false-discovery share 0.29023. Signal test (detected ≥ 2·(1−q)·eligible at q=0.95) passed. 2,745 narratives, 1,515 eligible, 261 detected, 75.75 expected false, 185.25 excess detections. Threshold 0.085985; window size 22 days. All 261 shifts date to 2026-06-08 — the boundary between the window's two 22-day halves; a 45-day span holds exactly two complete 22-day windows, so shift dating has window-boundary resolution, not day resolution. Window sufficiency: insufficient for arcs — 0 of 2,745 narratives can show emergence-peak-decline; 327 narratives (7,644 claims) right-censored; 90 days is a lower bound. Synthesis admission: cut 0.60, 130 above cut, corroboration required.<\/p>\n        <div class=\"pb-ro\"><p class=\"pb-ro-k\">Calibration readout · verbatim<\/p><p><strong>Journal:<\/strong> <code>reports/calibration/narrative_shift_detection_sweep_002.json<\/code> · <code>data_as_of<\/code> 2026-08-31T03:32:37.841686+00:00. <strong>Thresholds frozen:<\/strong> rule pre-registered in <code>narrative_shift_detection_sweep_001<\/code> (cal_10/#1012) and <code>narrative_shift_rule_001.json<\/code>, re-adopted verbatim at 2026-08-31T19:43Z. The narrative layer was re-materialised on the expanded corpus first (declared precondition): 2,655 narratives created, 720 retired, 90 unchanged, 24,470 claims covered, using the published emission cut from <code>narrative_emission_sweep_001<\/code> unchanged.<\/p><p>Metric: mean detected-shift confidence <strong>0.6085<\/strong> · false-discovery share <strong>0.290<\/strong>. Pre-registered admission bar: the 0.95-quantile of the date-shuffled permutation null; signal test detected ≥ 2×(1−q)×eligible — <strong>passed<\/strong> (261 detected vs 75.75 expected false; excess 185.25). Confidence per shift = √(coherence × source diversity); mean over detected 0.6085.<\/p><p>The same rule chose the same 22-day window (largest excess detections, ties to the larger window) at threshold 0.0860. The expanded layer more than tripled the eligible population (573 → 1,515) and the detection rate held up against its null with a <em>lower<\/em> false-discovery share (0.42 → 0.29).<\/p><h5>Every one of the 261 shifts is dated 2026-06-08 — read this correctly<\/h5><p>A 45-day span holds exactly two complete 22-day windows, so a “shift” here is a movement between the window’s first half (17 May – 6 Jun) and its second (8 – 29 Jun), and the date it carries is that boundary. The dating has window-boundary resolution, not day resolution. That the boundary coincides with the recalibrated escalation episode (7–10 Jun) is what the independent-corroboration requirement leans on — see <code>narrative_shifts_admitted.md<\/code>.<\/p><p><strong>Synthesis admission (frozen cut):<\/strong> per-shift confidence ≥ <strong>0.60<\/strong> AND second-method corroboration. <strong>130 of 261<\/strong> shifts clear the confidence cut; the corroboration verdict per shift is in <code>narrative_shifts_admitted.md<\/code>. The full unfiltered list, misses included: <code>narrative_shifts_full.json<\/code>.<\/p><h5>What it cannot claim<\/h5><p>A flagged shift is not a verdict on one narrative — the threshold is a population rate and ~29% of detections are expected false; the share is stated wherever the method is cited. No arc is observable on this window (0 of 2,745 narratives can show emergence → peak → decline; 327 narratives / 7,644 claims are right-censored); 90 days is a lower bound for arc work, not a settled answer. The narrative layer lives in the snapshot working store, re-emitted for this run.<\/p><p class=\"pb-ro-d\">Caveats carried: <code>snapshot_data<\/code>; <code>detection_is_a_rate<\/code>; <code>window_insufficient_for_arc<\/code>; <code>arc_not_observable<\/code>; <code>framing_unlabelled<\/code> (the ~40 conflict-framing columns stay NULL — an embedding cluster cannot make that judgement).<\/p><\/div><div style=\"height:14px\"><\/div><p style=\"margin: 0;\"><span class=\"pb-chip\">narrative_shift_detection · 2026-08-31 · narrative_shift_detection_sweep_002 · conf 0.6085 / FDR 0.290 · Tier A<\/span><\/p>\n      <\/div>\n    <\/details>\n\n    <h3 style=\"font-family: ui-monospace, Consolas, monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #8f86bd; margin: 40px 0 14px;\">Tier B · exploratory, uncalibrated, directional only<\/h3>\n    <p style=\"font-size: 14.5px; line-height: 25px; margin: 0 0 20px; max-width: 70ch; color: color-mix(in srgb, var(--color-text) 68%, transparent);\">Twenty-eight raw method sweeps, all run 2026-08-31 against the snapshot (data as of 2026-08-31T03:32:37Z, snapshot taken 2026-08-31T19:44:29Z). Period 2026-06-01 → 2026-06-30, frozen in thresholds_frozen.md §4; windowless graph methods read the materialised network instead. None carries published confidence. None enters the synthesis body.<\/p>\n\n    <details>\n      <summary>temporal.event_count_series <span class=\"pb-tier-b\">Tier B · Exploratory — uncalibrated, directional only<\/span><\/summary>\n      <div style=\"padding: 16px;\"><img data-src=\"figures/temporal__event_count_series.png\" alt=\"temporal.event_count_series\" style=\"display: block; width: 100%; height: auto; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><p style=\"font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; line-height: 19px; margin: 12px 0 0; color: #8f86bd;\">Result shape: 30 rows · rendered mechanically from the saved run output<\/p><div class=\"pb-ro\"><p class=\"pb-ro-k\">Copilot insight readout · verbatim<\/p><h4>Daily Event Volume Trends — June 2026<\/h4><p class=\"pb-ro-d\">Data basis: This report is based on a single method result: run 8722d9fa625445d8b1420d84d0726cac, produced by the temporal.event_count_series method (v1.0.0). The method returned daily event counts for the window 2026-06-01 through 2026-06-30, with no filters applied on actor, country, or severity. The data was read from a SQLite store and is complete for all 30 days in the window; no truncation or sampling occurred.<\/p><h5>Overview of June 2026 Event Volume<\/h5><p>The daily event count series covers the full month of June 2026, with 30 daily buckets and no missing days. Counts range from a low of 394 events on June 30 to a high of 1,231 events on June 8. The month opens at a moderate level (764 on June 1) and trends downward overall, but the trajectory is not monotonic — a sharp spike dominates the first third of the month before counts settle into a gradual decline.<\/p><h5>Early-Month Spike: June 7–11<\/h5><p>The most notable feature of the series is a cluster of elevated counts from June 7 through June 11. June 7 jumps to 1,052 from 535 the prior day — nearly a doubling. June 8 peaks at 1,231, the highest value in the window. Counts remain elevated through June 10 (1,048) before dropping back to 537 on June 12, returning to the pre-spike baseline. This five-day burst accounts for a disproportionate share of the month’s total volume and warrants closer examination to identify the actors, locations, or event types driving the surge.<\/p><h5>Gradual Decline in the Second Half<\/h5><p>After the June 7–11 spike resolves, daily counts settle into a band of roughly 500–600 events through June 21. From June 22 onward, the series enters a slow, steady decline: counts fall from 443 on June 22 to 394 on June 30, the lowest value in the month. The final ten days show no secondary spike and exhibit low day-to-day variance, suggesting a period of reduced but stable activity rather than a volatile downturn.<\/p><p class=\"pb-ro-pv\">Copilot provenance: turn <code>turn-NoNxXhivYnefLU4P<\/code> · model deepseek/deepseek-v4-flash-0731 · prompt v1; executor run ids: 8722d9fa625445d8b1420d84d0726cac.<\/p><\/div><p style=\"margin: 10px 0 0;\"><span class=\"pb-chip-b\">temporal.event_count_series · 2026-08-31 · run-2026-08-31-5535dd09 · confidence: none published (Tier B raw method) · Tier B<\/span><\/p><\/div>\n    <\/details>\n    <details>\n      <summary>temporal.event_anomaly_raw <span class=\"pb-tier-b\">Tier B · Exploratory — uncalibrated, directional only<\/span><\/summary>\n      <div style=\"padding: 16px;\"><img data-src=\"figures/temporal__event_anomaly_raw.png\" alt=\"temporal.event_anomaly_raw\" style=\"display: block; width: 100%; height: auto; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><p style=\"font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; line-height: 19px; margin: 12px 0 0; color: #8f86bd;\">Result shape: 30 rows · rendered mechanically from the saved run output<\/p><div class=\"pb-ro\"><p class=\"pb-ro-k\">Copilot insight readout · verbatim<\/p><h4>Daily Event Anomaly Detection — June 2026<\/h4><p class=\"pb-ro-d\">Data basis: One method result was read in full: run e7b935982b7245eb847d076ff4a00522, produced by temporal.event_anomaly_raw v1.0.0. It covers daily event counts from 2026-06-01 through 2026-06-30, using a z-score anomaly detection method with a threshold of 2.0 and 6 baseline periods. No filters were applied (actor, country, severity all null). All 30 daily buckets and their associated metadata (count, z_score, baseline_mean, anomalous flag) were included; no data was truncated or omitted.<\/p><h5>Anomalous Days Detected in June 2026<\/h5><p>The temporal.event_anomaly_raw method scanned all 30 days in June 2026 and flagged <strong>5 days as anomalous<\/strong> under a z-score threshold of 2.0:<\/p><ul><li><strong>June 7<\/strong> — count of 1,052 events against a baseline mean of ~620 (z = 5.81). This is a sharp upward spike.<\/li><li><strong>June 8<\/strong> — count of 1,231 events against a baseline mean of ~668 (z = 3.20). The highest single-day count in the month, continuing the surge from June 7.<\/li><li><strong>June 22<\/strong> — count of 443 events against a baseline mean of ~540 (z = −3.54). A notable downward anomaly, the most significant drop in the month.<\/li><li><strong>June 28<\/strong> — count of 503 events against a baseline mean of ~442 (z = 6.80). The strongest positive z-score in the entire window, indicating a sudden burst of activity relative to the preceding low-volume days.<\/li><li><strong>June 30<\/strong> — count of 394 events against a baseline mean of ~456 (z = −2.36). A downward anomaly closing out the month.<\/li><\/ul><p>The remaining 25 days did not exceed the z-score threshold in either direction.<\/p><h5>Overall Volume Trend and Context<\/h5><p>Beyond the flagged anomalies, the daily counts reveal a clear downward trend across the month. The first week (June 1–6) averaged roughly 620 events per day. After the June 7–8 spike, counts settled into a mid-month band of 500–600 before declining further. The final week (June 23–30) averaged approximately 440 events per day — a roughly 30% reduction from the early-June baseline.<\/p><p>This declining trend means the rolling baseline mean adjusted downward over time, which is why June 28’s count of 503 (unremarkable in early-June terms) registered as a strong positive anomaly (z = 6.80) relative to its local baseline of ~442. Analysts should be aware that the z-score method’s sensitivity shifts as the baseline window moves, so the same absolute count can be anomalous or non-anomalous depending on when it occurs in the series.<\/p><h5>Pattern Interpretation<\/h5><p>The anomalies cluster into two patterns:<\/p><ol><li><strong>Upward spikes (June 7–8, June 28):<\/strong> These represent sudden surges in event volume — roughly 70–180% above the local baseline. The June 7–8 spike is the most sustained, spanning two consecutive days. The June 28 spike is a single-day burst.<\/li><li><strong>Downward drops (June 22, June 30):<\/strong> These represent unusually quiet days relative to the local baseline. June 22 (z = −3.54) is the more statistically significant of the two.<\/li><\/ol><p>No filters were applied in this run (actor, country, and severity were all null), so these anomalies reflect aggregate event volume across all actors and geographies in the corpus. To determine whether a specific actor, region, or event type drove these spikes or drops, a follow-up run with appropriate filters would be needed.<\/p><p class=\"pb-ro-pv\">Copilot provenance: turn <code>turn-QSE0zGLd8LrSpROE<\/code> · model deepseek/deepseek-v4-flash-0731 · prompt v1; executor run ids: e7b935982b7245eb847d076ff4a00522.<\/p><\/div><p style=\"margin: 10px 0 0;\"><span class=\"pb-chip-b\">temporal.event_anomaly_raw · 2026-08-31 · run-2026-08-31-3d379c8f · confidence: none published (Tier B raw method) · Tier B<\/span><\/p><\/div>\n    <\/details>\n    <details>\n      <summary>temporal.change_point <span class=\"pb-tier-b\">Tier B · Exploratory — uncalibrated, directional only<\/span><\/summary>\n      <div style=\"padding: 16px;\"><img data-src=\"figures/temporal__change_point.png\" alt=\"temporal.change_point\" style=\"display: block; width: 100%; height: auto; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><p style=\"font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; line-height: 19px; margin: 12px 0 0; color: #8f86bd;\">Result shape: 30 rows · rendered mechanically from the saved run output<\/p><div class=\"pb-ro\"><p class=\"pb-ro-k\">Copilot insight readout · verbatim<\/p><h4>Daily Event Volume and Change Points in June 2026<\/h4><p class=\"pb-ro-d\">Data basis: Daily event counts and change-point flags from the temporal.change_point method (run_id 3f8f6cd935094efdba4e0afd07fa6512) covering June 1–30, 2026. No data was truncated or omitted from this prompt.<\/p><h5>Overall Event Volume Trends<\/h5><p>Throughout June 2026, the daily event count exhibits three distinct phases. The month begins with a gradual decline from 764 events on June 1 down to 535 events by June 6. A sharp and sustained spike occurs between June 7 and June 11, with daily counts peaking at 1,231 on June 8. Following this active period, the volume drops back to baseline levels on June 12 (537 events) and enters a slow, steady decline for the remainder of the month, ending at 394 events on June 30.<\/p><h5>Key Change Points and Spikes<\/h5><p>The change point analysis flags June 7 as a critical shift, marking the transition from the early-month decline to the mid-month surge. The peak activity on June 8 (1,231 events) represents the highest volume in the observed window. A second major change point is flagged on June 12, where the count falls from 854 to 537, signaling the end of the surge and a return to lower baseline activity. For the rest of the month, change points are frequently flagged, reflecting the gradual downward trend and minor daily fluctuations as the month concludes.<\/p><p class=\"pb-ro-pv\">Copilot provenance: turn <code>turn-92aJa-dKnPSocSFf<\/code> · model deepseek/deepseek-v4-flash-0731 · prompt v1; executor run ids: 3f8f6cd935094efdba4e0afd07fa6512.<\/p><\/div><p style=\"margin: 10px 0 0;\"><span class=\"pb-chip-b\">temporal.change_point · 2026-08-31 · run-2026-08-31-fba6ca9a · confidence: none published (Tier B raw method) · Tier B<\/span><\/p><\/div>\n    <\/details>\n    <details>\n      <summary>temporal.coverage_gap_scan <span class=\"pb-tier-b\">Tier B · Exploratory — uncalibrated, directional only<\/span><\/summary>\n      <div style=\"padding: 16px;\"><img data-src=\"figures/temporal__coverage_gap_scan.png\" alt=\"temporal.coverage_gap_scan\" style=\"display: block; width: 100%; height: auto; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><p style=\"font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; line-height: 19px; margin: 12px 0 0; color: #8f86bd;\">Result shape: 0 rows · rendered mechanically from the saved run
