e=\"margin: 10px 0 0;\"><span class=\"pb-chip-b\">temporal.coverage_gap_scan · 2026-08-31 · run-2026-08-31-dad70523 · confidence: none published (Tier B raw method) · Tier B<\/span><\/p><\/div>\n    <\/details>\n    <details>\n      <summary>severity.distribution <span class=\"pb-tier-b\">Tier B · Exploratory — uncalibrated, directional only<\/span><\/summary>\n      <div style=\"padding: 16px;\"><img data-src=\"figures/severity__distribution.png\" alt=\"severity.distribution\" style=\"display: block; width: 100%; height: auto; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><p style=\"font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; line-height: 19px; margin: 12px 0 0; color: #8f86bd;\">Result shape: 4 rows · rendered mechanically from the saved run output<\/p><div class=\"pb-ro\"><p class=\"pb-ro-k\">Copilot insight readout · verbatim<\/p><h4>Event Severity Distribution Analysis for June 2026<\/h4><p class=\"pb-ro-d\">Data basis: The analysis is based on the results of the severity.distribution method (run_id: b68ec22dea1d44b78f863d8b0dfea1c2) covering the period from June 1, 2026, to June 30, 2026. The data includes counts of events grouped by severity levels (2 through 5). No data was truncated or omitted.<\/p><h5>Severity Distribution Overview for June 2026<\/h5><p>During June 2026, the event corpus recorded a total of 18,472 events across severity levels 2 through 5. The vast majority of these events (16,328) were classified as severity 2, making up approximately 88.4% of all recorded activity. Higher severity events were significantly less frequent: severity 5 accounted for 1,140 events (6.2%), severity 4 accounted for 783 events (4.2%), and severity 3 was the rarest with only 221 events (1.2%). This distribution indicates that while the overall volume of events was high, most were of a lower severity, though the presence of over a thousand severity 5 events highlights notable high-impact incidents during the month.<\/p><p class=\"pb-ro-pv\">Copilot provenance: turn <code>turn--3XHQuc7HP0bIDOF<\/code> · model deepseek/deepseek-v4-flash-0731 · prompt v1; executor run ids: b68ec22dea1d44b78f863d8b0dfea1c2.<\/p><\/div><p style=\"margin: 10px 0 0;\"><span class=\"pb-chip-b\">severity.distribution · 2026-08-31 · run-2026-08-31-a002152d · confidence: none published (Tier B raw method) · Tier B<\/span><\/p><\/div>\n    <\/details>\n    <details>\n      <summary>severity.weighted_series <span class=\"pb-tier-b\">Tier B · Exploratory — uncalibrated, directional only<\/span><\/summary>\n      <div style=\"padding: 16px;\"><img data-src=\"figures/severity__weighted_series.png\" alt=\"severity.weighted_series\" style=\"display: block; width: 100%; height: auto; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><p style=\"font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; line-height: 19px; margin: 12px 0 0; color: #8f86bd;\">Result shape: 30 rows · rendered mechanically from the saved run output<\/p><div class=\"pb-ro\"><p class=\"pb-ro-k\">Copilot insight readout · verbatim<\/p><h4>Weighted Severity Daily Series — June 2026: Mid-Month Surge and Gradual Decline<\/h4><p class=\"pb-ro-d\">Data basis: All data was read from a single method envelope: run 179bd23317a845e2931c2cdb3965bc89, produced by severity.weighted_series v1.0.0. The method returned a daily sum of weighted severity values for the window 2026-06-01 through 2026-06-30, with no actor, country, or severity filters applied. All 30 daily buckets were provided in full; no data was truncated or omitted due to token budget limits.<\/p><h5>Overall Trend and Phasing<\/h5><p>The weighted severity series for June 2026 shows three distinct phases. The month opens at a moderately elevated level (1,726 on June 1) and declines steadily through June 6, reaching 1,279. This first week suggests a cooling period with day-over-day decreases averaging roughly 75–90 points per day.<\/p><p>A sharp escalation begins on June 7, when the value jumps to 2,396 — nearly double the prior day. The peak occurs on June 8 at 2,754, the highest value in the entire month. Elevated levels persist through June 11 (1,920), after which the series drops back to 1,213 on June 12. This five-day window (June 7–11) accounts for the most intense activity in the dataset and likely reflects a concentrated burst of high-severity events.<\/p><p>From June 12 onward, the series enters a gradual, sustained decline. Values hover between 1,000 and 1,300 for most of the second half of the month, with minor fluctuations but no secondary spike. The month closes at 894 on June 30, the lowest value in the series, indicating that activity had returned to — or fallen below — the baseline observed at the start of the month.<\/p><h5>The June 7–11 Surge in Detail<\/h5><p>The defining feature of this series is the June 7–11 surge. The peak on June 8 (2,754) is approximately 2.4 times the value recorded just two days earlier on June 6 (1,279). Even the lowest day within the surge window (June 9 at 1,870) exceeds every value recorded outside that window. The cumulative weighted severity for the five-day surge period is roughly 11,221, compared with approximately 8,915 for the first six days of the month combined — meaning the surge window, despite spanning only five days, generated more weighted severity than the entire preceding week.<\/p><p>After the surge subsides, the series never recovers to its early-June levels. The post-surge plateau (June 12–30) averages roughly 1,150 per day, compared with an average of about 1,435 per day for June 1–6. This suggests the mid-month event may have marked a structural shift rather than a transient anomaly, though the data alone cannot confirm causation.<\/p><h5>Late-Month Decline and Baseline<\/h5><p>The second half of June exhibits a slow but consistent downward drift. From June 12 (1,213) to June 30 (894), the series loses roughly 319 points over 19 days — an average decline of about 17 points per day. The decline is not perfectly monotonic; minor upticks appear on June 14 (1,745), June 21 (1,286), and June 28 (1,168), but none approach surge-window levels. The closing value of 894 is the lowest in the month, and the trend at month-end points downward, suggesting that if the window were extended into July, values might continue to moderate.<\/p><p>Analysts should note that this series carries no actor, country, or severity filters, so the pattern reflects aggregate activity across the full corpus. Disaggregating by actor or geography would be a logical next step to determine whether the June 7–11 surge was driven by a specific actor or region, or whether it reflects a broad-based escalation.<\/p><p class=\"pb-ro-pv\">Copilot provenance: turn <code>turn-uDfVdC9qDU9PhAW4<\/code> · model deepseek/deepseek-v4-flash-0731 · prompt v1; executor run ids: 179bd23317a845e2931c2cdb3965bc89.<\/p><\/div><p style=\"margin: 10px 0 0;\"><span class=\"pb-chip-b\">severity.weighted_series · 2026-08-31 · run-2026-08-31-13b20883 · confidence: none published (Tier B raw method) · Tier B<\/span><\/p><\/div>\n    <\/details>\n    <details>\n      <summary>geo.event_map <span class=\"pb-tier-b\">Tier B · Exploratory — uncalibrated, directional only<\/span><\/summary>\n      <div style=\"padding: 16px;\"><img data-src=\"figures/geo__event_map.png\" alt=\"geo.event_map\" style=\"display: block; width: 100%; height: auto; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><p style=\"font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; line-height: 19px; margin: 12px 0 0; color: #8f86bd;\">Result shape: features 1,578 rows; unmapped_count 12,079; unmapped_sample 20 rows · rendered mechanically from the saved run output<\/p><p style=\"font-size: 13.5px; line-height: 23px; margin: 10px 0 0; padding-left: 14px; border-left: 1px solid var(--color-accent); color: #b3acd0;\">Envelope warning <code>sparse_geo<\/code>: 12,079 event(s) could not be geo-resolved and are excluded from the map. Across the calibrated window, the map speaks for the plottable 34.6% of events, not all.<\/p><div class=\"pb-ro\"><p class=\"pb-ro-k\">Copilot insight readout · verbatim<\/p><h4>Geographic Distribution of Events — June 2026<\/h4><p class=\"pb-ro-d\">Data basis: This report is based on a single method execution (run_id f792bd0bd03041e08b2bc7f9920627dc) of the geo.event_map method (version 1.0.0), which mapped all events from June 1–30, 2026 with no filters applied (actor, country, and severity filters were all null; weight_by was set to ‘none’). The data was sourced from a SQLite store as of 2026-06-30. The rendered visualization is a Leaflet point map (map_points). The GeoJSON FeatureCollection in the payload contained hundreds of location features with event counts, but the data was TRUNCATED due to token budget limits — the full feature list was cut off partway through. Additionally, the method reported an unmapped_count of 12,079 events that could not be assigned specific geographic coordinates. The analysis below is therefore based on the visible portion of the data only.<\/p><h5>Overview of the June 2026 Event Map<\/h5><p>The geo.event_map method returned a geospatial point map covering all events recorded between June 1 and June 30, 2026, with no actor, country, or severity filters applied. The rendered visualization plots each location as a point sized by event count. The dataset includes locations spanning the Middle East, Europe, North America, South Asia, and beyond, though the overwhelming concentration of activity falls within the Israel–Palestine–Lebanon–Iran corridor. A total of 12,079 events could not be mapped to specific coordinates (reported as unmapped_count), which means the point map represents only the geolocated subset of the full event corpus for this period.<\/p><h5>Top Event Hotspots<\/h5><p>The highest-volume locations in the visible data are dominated by the Israel–Gaza–Iran–Lebanon axis. Israel (country-level aggregate) leads with 322 events, followed by Gaza City at 292 events. Tehran appears as a major node with 224 events at the city level and 182 at the country level for Iran, suggesting intense activity concentrated in the Iranian capital. Lebanon recorded 137 events country-wide, with Beirut accounting for 123 of those. Jerusalem (124 events) and Tel Aviv (80 events) are the next most active Israeli locations. These six locations alone account for over 1,000 mapped events and define the core geographic footprint of the period’s activity.<\/p><h5>Secondary Clusters and Regional Patterns<\/h5><p>Beyond the top-tier hotspots, the map reveals several secondary clusters. In the Levant, Damascus (24 events), Tyre (27), Nabatieh (27), and south Lebanon (27) indicate sustained activity across Syria and southern Lebanon. The West Bank and Gaza Strip each recorded 38 events, with specific localities such as Khan Younis (14), Rafah (14), Deir al-Balah (17), and Hebron (26) showing distributed activity across Palestinian territories. In the Gulf region, Yemen (35), Saudi Arabia (35), Oman (34), Qatar (34), Bahrain (29), and Kuwait (28) all appear, suggesting broad regional engagement. Iran’s secondary locations — Bandar Abbas (24), Minab (22), Isfahan (17), Qeshm (20), and Bushehr (7) — point to activity along Iran’s southern coast and interior. Iraq (39 events country-wide, with Baghdad at 19 and Erbil at 22) and Pakistan (40 events, including Islamabad at 31) round out the regional picture.<\/p><h5>Out-of-Region and Global Activity<\/h5><p>The map also captures activity outside the Middle East core. Washington (42 events), New York (19), and the White House (14) indicate significant diplomatic or policy-related event coverage in the United States. European capitals appear with modest counts: London (12), Paris (11), Moscow (13), and Geneva (14). Turkey recorded 22 events country-wide. The presence of these locations alongside the Middle East hotspots suggests that the event corpus for June 2026 includes both on-the-ground conflict events and international political or diplomatic responses. The long tail of the distribution — hundreds of locations with single-digit event counts — extends across dozens of countries and smaller localities, though the data payload was truncated before the full tail could be reviewed.<\/p><h5>Data Quality and Coverage Notes<\/h5><p>Two important data-quality considerations apply to this map. First, the unmapped_count of 12,079 indicates that a large number of events in the underlying corpus could not be assigned specific geographic coordinates and therefore do not appear as points on the map. The visible points represent only the geolocated subset. Second, the GeoJSON feature list in the payload was truncated due to token budget limits, so the analysis above is based on the visible portion of the data — approximately the top several hundred features sorted by event count. Locations with very low event counts (1–5 events) in the tail of the distribution were not fully reviewed. Analysts should be aware that the complete dataset may contain additional locations or patterns not captured in this summary. The method also returned duplicate or near-duplicate location entries (e.g., multiple entries for Tehran, Beirut, Gaza, and Tel Aviv under slightly different name variants), which means some country or city totals are split across multiple point features rather than aggregated into a single count.<\/p><p class=\"pb-ro-pv\">Copilot provenance: turn <code>turn-nZ4N-CJ6vNtRY5cb<\/code> · model deepseek/deepseek-v4-flash-0731 · prompt v1; executor run ids: f792bd0bd03041e08b2bc7f9920627dc.<\/p><\/div><p style=\"margin: 10px 0 0;\"><span class=\"pb-chip-b\">geo.event_map · 2026-08-31 · run-2026-08-31-2fa54db1 · confidence: none published (Tier B raw method) · Tier B<\/span><\/p><\/div>\n    <\/details>\n    <details>\n      <summary>geo.concentration <span class=\"pb-tier-b\">Tier B · Exploratory — uncalibrated, directional only<\/span><\/summary>\n      <div style=\"padding: 16px;\"><img data-src=\"figures/geo__concentration.png\" alt=\"geo.concentration\" style=\"display: block; width: 100%; height: auto; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><p style=\"font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; line-height: 19px; margin: 12px 0 0; color: #8f86bd;\">Result shape: 10 rows · rendered mechanically from the saved run output<\/p><div class=\"pb-ro\"><p class=\"pb-ro-k\">Copilot insight readout · verbatim<\/p><h4>Geographic Concentration of Events — June 2026<\/h4><p class=\"pb-ro-d\">Data basis: Read one method envelope for run e94f8cb060fa4adaafccf782f5f1558f (method geo.concentration v1.0.0). The method counted events per location for the window 2026-06-01 through 2026-06-30 with no actor, country, or severity filters applied, returning the top 10 locations by event count. The full data payload (10 rows) was included; no truncation or sampling occurred.<\/p><h5>Method and Scope<\/h5><p>The geo.concentration method (v1.0.0) was executed over the full calendar month of June 2026 (2026-06-01 to 2026-06-30). No filters were applied on actor, actor type, country, or minimum severity, so the counts reflect all recorded events in the corpus regardless of participant or intensity. The method returned the top 10 locations by event count, sourced from the sqlite store with a data-as-of date of 2026-06-30.<\/p><h5>Top Locations by Event Count<\/h5><p>Israel as a whole leads with 322 events, followed by Gaza City at 280 and Tehran at 224. Iran (country-level) appears separately at 182, suggesting that a substantial share of Iran-related events are tagged at the national level rather than to a specific city. Lebanon records 137 events, with Beirut (121) and southern Lebanon (61) breaking out as distinct sub-locations. Jerusalem (124) and Tel Aviv (80) are the other major Israeli urban centers in the top ten. The Strait of Hormuz appears with 65 events, indicating maritime or chokepoint activity during the period.<\/p><h5>Regional Concentration Patterns<\/h5><p>The top ten locations cluster into three broad geographic zones. The Israel–Gaza corridor (Israel, Gaza City, Jerusalem, Tel Aviv) accounts for 806 events combined, making it the dominant theater of activity. The Iran axis (Tehran, Iran national-level, Strait of Hormuz) totals 471 events, pointing to sustained activity both in the Iranian capital and along maritime routes. The Lebanon cluster (Lebanon, Beirut, southern Lebanon) totals 319 events, with roughly two-thirds concentrated in Beirut. The presence of both national-level and city-level entries for Israel and Iran indicates mixed geocoding granularity in the underlying corpus; analysts should be aware that national-level counts may overlap with or duplicate city-level counts for the same country.<\/p><p class=\"pb-ro-pv\">Copilot provenance: turn <code>turn-geAgWtQuBsDAw7Ve<\/code> · model deepseek/deepseek-v4-flash-0731 · prompt v1; executor run ids: e94f8cb060fa4adaafccf782f5f1558f.<\/p><\/div><p style=\"margin: 10px 0 0;\"><span class=\"pb-chip-b\">geo.concentration · 2026-08-31 · run-2026-08-31-95a8d202 · confidence: none published (Tier B raw method) · Tier B<\/span><\/p><\/div>\n    <\/details>\n    <details>\n      <summary>actor.alliance_opposition_map <span class=\"pb-tier-b\">Tier B · Exploratory — uncalibrated, directional only<\/span><\/summary>\n      <div style=\"padding: 16px;\"><img data-src=\"figures/actor__alliance_opposition_map.png\" alt=\"actor.alliance_opposition_map\" style=\"display: block; width: 100%; height: auto; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><p style=\"font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; line-height: 19px; margin: 12px 0 0; color: #8f86bd;\">Result shape: nodes 200 rows; links 560 rows · rendered mechanically from the saved run output<\/p><div class=\"pb-ro\"><p class=\"pb-ro-k\">Copilot insight readout · verbatim<\/p><h4>Global Actor Alliance-Opposition Network: Mapping Political Relationships Across the Middle East, US, and Europe<\/h4><p class=\"pb-ro-d\">Data basis: This report is based on a single method execution (run_id 57b2320c674a4ae493c93c4a2a027c91) of the actor.alliance_opposition_map method (v1.0.0), which queried the Neo4j actor relationship store for all alliance and opposition relationships with a maximum of 200 nodes and 1000 edges. The data as-of date is 2026-08-31. The method returned a force-directed network graph containing actor nodes (states, governments, military forces, rebel groups, militias, NGOs, media organizations, civilian groups, and political parties) connected by ALLIED_WITH and OPPOSED_TO edges. IMPORTANT: The data payload was truncated due to token budget limits — the full node list and edge list were not completely available for analysis. The visible portion included approximately 150+ nodes and a substantial subset of edges. Analysis below is based on the visible (non-truncated) portion of the data only.<\/p><h5>Network Overview and Actor Composition<\/h5><p>The alliance-opposition map captures a broad, multi-regional network of political actors spanning the Middle East, North America, Europe, and beyond. The visible nodes include states (United States, Israel, Iran, Saudi Arabia, Jordan, Syria, Germany, Italy, Sudan, Ukraine, Australia), government bodies (US Congress, Israeli Ministry of Defense, Iranian Ministry of Foreign Affairs, Lebanese government, UK government), military forces (Islamic Revolutionary Guard Corps, Israeli occupation forces, US Navy, Saudi Arabian army, Turkish Air Force), rebel and militia groups (Hamas, Ansarallah, Al-Qaeda, Rapid Support Forces, Izz al-Din al-Qassam Brigades, Lebanese resistance), political parties (Democratic Party, AIPAC), media organizations (CBS News, Iran International, Tucker Carlson, Al-Akhbar), NGOs (Refugees International, Doctors for Gaza), and various civilian groups (pro-Palestine protesters, Haredi community, demonstrators, Lebanese people). The diversity of actor types — from states down to unattributed individuals and groups — indicates the graph draws on a wide corpus of event reporting.<\/p><p>Because the data was truncated, the full extent of the network cannot be assessed. The visible portion suggests the graph is densely connected, with several actors serving as major hubs of opposition relationships.<\/p><h5>The IRGC as a Central Opposition Hub<\/h5><p>The Islamic Revolutionary Guard Corps (IRGC) is the most densely connected node in the visible portion of the graph, with dozens of OPPOSED_TO edges radiating outward. Its oppositions include the United States, Israel, Saudi Arabia, Jordan, the United States Navy Fifth Fleet, various European actors, and multiple regional governments. The IRGC also has a smaller number of ALLIED_WITH edges, including one to the Islamic Republic of Iran Army, reflecting internal Iranian military coordination. The high degree of opposition edges centered on the IRGC underscores its role as a central antagonist in multiple regional conflicts — against Israel, against US and Western military presence in the region, and against Sunni Arab states.<\/p><p>The IRGC’s allied relationships visible in the data include connections to the Iranian Army and to actors described as allied with Iran’s broader network, consistent with its position as the backbone of Iran’s regional power projection.<\/p><h5>Hamas and the Israel-Palestine Conflict Cluster<\/h5><p>Hamas appears as another major hub, with opposition edges to Israel, Israeli occupation forces, the Palestinian Authority, Bezalel Smotrich, the United States, and various Israeli government and military actors. Notably, Hamas also has an ALLIED_WITH edge to the United States in one instance (confidence 0.7) alongside an OPPOSED_TO edge (confidence 0.55), reflecting an ambiguous or contested relationship in the source data. Hamas is allied with Ansarallah (the Houthi movement in Yemen) and with Lebanese resistance, consistent with the broader Iran-aligned “Axis of Resistance” network.<\/p><p>The opposition between Hamas and the Palestinian Authority (confidence 0.78) highlights the intra-Palestinian political divide. Hamas also opposes multiple Israeli actors including Smotrich, the Israeli extremist ministers, and the Netanyahu coalition, with confidence scores ranging from 0.85 to 0.95, indicating high-confidence opposition relationships.<\/p><h5>Donald Trump and US Domestic-International Linkages<\/h5><p>Donald Trump is a highly connected node with both opposition and alliance edges. He is opposed to the Democratic Party, Iranian officials, the Iranian Foreign Minister, Giorgia Meloni, and various other political figures. He is allied with AIPAC (confidence 0.8), the Netanyahu coalition, and several US conservative and right-wing actors. Trump also has a dual relationship with the United States — both opposed and allied — reflecting the politically contested nature of his relationship with the US government apparatus.<\/p><p>The Trump node illustrates how domestic US political dynamics are woven into the broader international alliance-opposition graph, linking American political actors to Middle Eastern conflicts through relationships with Israeli and Iranian actors.<\/p><h5>Regional Clusters and Cross-Cutting Alignments<\/h5><p>Several clusters of actors emerge from the visible edge data:<\/p><ol><li><strong>Iran-aligned network<\/strong>: The IRGC, Iranian Army, Iranian Ministry of Foreign Affairs, Ansarallah, Hamas, Lebanese resistance, and Mahdi Al-Mashat (Yemen) form a web of mutual alliances, with shared opposition to Israel, the United States, and Saudi Arabia.<\/li><li><strong>Israel and allies<\/strong>: Israeli government actors (Netanyahu coalition, Smotrich, Israeli Ministry of Defense, Knesset National Security Committee) are allied with the United States, AIPAC, and various Western governments, while opposing Hamas, the IRGC, Lebanese resistance, and Palestinian actors.<\/li><li><strong>US military presence<\/strong>: The US Navy, US Navy Fifth Fleet, US Marine Corps, US Air Force, and US European Command form a cluster with opposition edges to Iranian and regional armed groups.<\/li><li><strong>European actors<\/strong>: The UK government, Italy, Germany, Poland, and France appear with various opposition and alliance relationships, generally aligned with the US and Israel while opposing Iran and its proxies.<\/li><li><strong>Lebanon<\/strong>: The Lebanese government, Lebanese President Joseph Aoun, UNIFIL, and Lebanese displaced persons form a cluster caught between Israeli military pressure and Hezbollah/Lebanese resistance activity.<\/li><\/ol><p>Because the data was truncated, these clusters represent only the visible portion of the network. Additional clusters and relationships may exist in the omitted data.<\/p><h5>Data Quality and Confidence Observations<\/h5><p>Several edges in the graph carry dual relationships — both ALLIED_WITH and OPPOSED_TO between the same pair of actors. For example, the United Kingdom government has both an opposition (0.55) and an alliance (0.65) edge to the same target, and Donald Trump has both opposition and alliance edges to the United States. These dual relationships likely reflect temporal shifts, contested framing in source materials, or actors whose relationship changed over the reporting period.<\/p><p>Confidence scores vary widely across edges, from 0.35 (low confidence, e.g., IRGC opposed to an unnamed actor) to 0.95 (high confidence, e.g., Hamas opposed to Israeli occupation forces, and Sudan allied with an unnamed actor). Many edges carry null confidence scores, indicating that the relationship was extracted but not scored for reliability. Analysts should treat null-confidence edges with appropriate caution.<\/p><p>The temporal_status field is null across all visible edges, meaning the graph does not currently encode time-bounded relationship windows. This limits the ability to distinguish current from historical alliances and oppositions.<\/p><p class=\"pb-ro-pv\">Copilot provenance: turn <code>turn-KAHKLjzgEv_78Aqc<\/code> · model deepseek/deepseek-v4-flash-0731 · prompt v1; executor run ids: 57b2320c674a4ae493c93c4a2a027c91.<\/p><\/div><p style=\"font-size: 13.5px; line-height: 23px; margin: 12px 0 0; padding-left: 14px; border-left: 1px solid var(--color-accent); color: #b3acd0;\">Envelope warning <code>truncated_by_limit<\/code>: Node result was truncated at the max_nodes limit (200). Increase max_nodes or add seed_actor_ids.<\/p><p style=\"margin: 10px 0 0;\"><span class=\"pb-chip-b\">actor.alliance_opposition_map · 2026-08-31 · run-2026-08-31-e936b453 · confidence: none published (Tier B raw method) · Tier B<\/span><\/p><\/div>\n    <\/details>\n    <details>\n      <summary>actor.ego_network <span class=\"pb-tier-b\">Tier B · Exploratory — uncalibrated, directional only<\/span><\/summary>\n      <div style=\"padding: 16px;\"><img data-src=\"figures/actor__ego_network.png\" alt=\"actor.ego_network\" style=\"display: block; width: 100%; height: auto; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><p style=\"font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; line-height: 19px; margin: 12px 0 0; color: #8f86bd;\">Result shape: nodes 300 rows; links 1,939 rows · rendered mechanically from the saved run output<\/p><div class=\"pb-ro\"><p class=\"pb-ro-k\">Copilot insight readout · verbatim<\/p><h4>Ego Network Analysis of Actor 2670c1dc: Relational Structure, Key Hubs, and Conflict Dynamics<\/h4><p class=\"pb-ro-d\">Data basis: This report is based on a single method execution: actor.ego_network (run_id 81e580da00924e4ca8825b409112884e) querying actor 2670c1dcd9a941afa6ef590227c878b6 at 2 hops, with a max of 300 nodes and 2000 edges, sourced from the neo4j store as of 2026-08-31. The figure_spec in the metadata OYS, SUBORDINATE_TO, and OPPOSED_TO edges, indicating a military command role. Due to data truncation, additional high-connectivity actors may exist in the full network that are not visible in this analysis.<\/p><h5>Claims, Narratives, and Information Layer<\/h5><p>The network contains a substantial number of claim and narrative nodes connected to actors and events through ATTRIBUTED_TO, ASSERTS_EVENT, SOURCED_BY, CORROBORATES_CLAIM, and EXEMPLIFIED_BY edges. Multiple narratives (e.g., 000246c0482744e7889d4810bdf0a0b9, 01324b43f4da462da2c14c1a4ab830b1, 040a9eddbdcd47d4bb5afd629ce39657) are attributed to the central actor and source multiple claims and events. The EXEMPLIFIED_BY edges carry confidence scores ranging from approximately 0.78 to 0.95, indicating moderate to high confidence in the narrative-to-event linkages. CORROBORATES_CLAIM edges also carry confidence scores (e.g., 0.71–0.79), showing that some claims are independently corroborated. This layered structure of narratives, claims, and events suggests the central actor is not only involved in direct actions but also is the subject of and source for significant narrative framing in the corpus.<\/p><h5>Conflict and Cooperation Dynamics<\/h5><p>The ego network reveals a complex conflict and cooperation landscape around the central actor. Opposition relationships are widespread: the central actor is OPPOSED_TO multiple actors, and several actors in the network are opposed to each other. Simultaneously, alliance and military support relationships exist — PROVIDES_MILITARY_AID_TO, SUPPLIES_WEAPONS_TO, and ALLIED_WITH edges create a web of military partnerships. The presence of both OPPOSED_TO and ALLIED_WITH edges between the same pair of actors (e.g., 025cf9459cf54137b4e0f38a2f081ac6 and the central actor) suggests shifting or context-dependent relationships. Diplomatic and humanitarian relationships (NEGOTIATES_WITH, MEDIATES_BETWEEN, DIPLOMATIC_REPRESENTATION, COORDINATES_HUMANITARIAN_WITH) add a layer of political engagement alongside the military dynamics. The involvement of Iranian government entities, Israeli military actors, Gulf state actors (Kuwait, Saudi Arabia), and the UK government indicates a regionally and internationally significant network. Due to token budget truncation, the full extent of these patterns may be larger than what is described here.<\/p><p class=\"pb-ro-pv\">Copilot provenance: turn <code>turn-4rD-WGzBvyvFxGhF<\/code> · model deepseek/deepseek-v4-flash-0731 · prompt v1; executor run ids: 81e580da00924e4ca8825b409112884e.<\/p><\/div><p style=\"font-size: 13.5px; line-height: 23px; margin: 12px 0 0; padding-left: 14px; border-left: 1px solid var(--color-accent); color: #b3acd0;\">Envelope warning <code>truncated_by_limit<\/code>: Node result was truncated at max_nodes=300. Reduce hops or increase max_nodes.<\/p><p style=\"margin: 10px 0 0;\"><span class=\"pb-chip-b\">actor.ego_network · 2026-08-31 · run-2026-08-31-3937933b · confidence: none published (Tier B raw method) · Tier B<\/span><\/p><\/div>\n    <\/details>\n    <details>\n      <summary>actor.degree_centrality <span class=\"pb-tier-b\">Tier B · Exploratory — uncalibrated, directional only<\/span><\/summary>\n      <div style=\"padding: 16px;\"><img data-src=\"figures/actor__degree_centrality.png\" alt=\"actor.degree_centrality\" style=\"display: block; width: 100%; height: auto; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><p style=\"font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; line-height: 19px; margin: 12px 0 0; color: #8f86bd;\">Result shape: rows 50 · rendered mechanically from the saved run output<\/p><div class=\"pb-ro\"><p class=\"pb-ro-k\">Copilot insight readout · verbatim<\/p><h4>Top 50 Actors by Degree Centrality — Network Core Analysis<\/h4><p class=\"pb-ro-d\">Data basis: This report is based on a single method execution of actor.degree_centrality (run_id e71b443fce874f3fb6fda284223a46d9), which queried the Neo4j store for the top 50 actors by bidirectional degree centrality as of 2026-08-31. The method used default parameters (top_n=50, direction=both, no relation filter, no seed actors). All 50 rows were provided in full; no data was truncated or omitted due to token budget limits.<\/p><h5>Overview of Degree Centrality Results<\/h5><p>The degree centrality results identify the 50 most connected actors in the event corpus, measured across both incoming and outgoing relationships. The top-ranked actor is <strong>Israelis<\/strong> (degree 8,260), a civilian group affiliated with Israel, followed by <strong>Iran24<\/strong> (degree 7,914), an Iranian media organization, and the <strong>United States<\/strong> (degree 6,647). These three actors alone account for a disproportionate share of total connections, with the top actor’s degree more than three times that of the 10th-ranked actor (Islamic Revolutionary Guard Corps, degree 1,483). The steep drop-off after the top six actors — all exceeding 3,700 connections — indicates a heavily concentrated network core with a long tail of progressively less connected actors.<\/p><h5>Country Affiliation Concentration<\/h5><p>The top 50 actors are dominated by four country affiliations. <strong>Iran<\/strong> (IRN) appears most frequently with 11 entries, including Iran24, the Islamic Revolutionary Guard Corps, Iranian armed forces, and several government officials such as Foreign Minister Abbas Araghchi and parliament speaker Mohammad Bagher Ghalibaf. <strong>Israel<\/strong> (ISR) follows with 10 entries, spanning civilian groups (Israelis, Israeli settler), military forces (Israeli soldier, Israeli military maneuvering forces, Israeli occupation forces), and government figures (Benjamin Netanyahu, Itamar Ben-Gvir, Bezalel Smotrich). The <strong>United States<\/strong> (USA) contributes 8 entries, including the state-level United States actor, Donald Trump, US CENTCOM, and the United States military. <strong>Lebanon<\/strong> (LBN) appears 5 times, led by Hezbollah (degree 4,524) and including the Lebanese government and Lebanese Army. The remaining entries are spread across single appearances from Pakistan, Russia, Saudi Arabia, the UAE, Qatar, Oman, Turkiye, Ukraine, China, Kuwait, Bahrain, and France, plus one actor (Middle East Spectator) with no country affiliation.<\/p><h5>Actor Type Breakdown<\/h5><p>The actor type distribution among the top 50 reveals that <strong>state<\/strong> actors are the most numerous category with 16 entries, though they span a wide degree range from 6,647 (United States) down to 234 (France). <strong>Government<\/strong> officials and bodies account for 11 entries, heavily concentrated in Iranian and Israeli figures. <strong>Military<\/strong> actors comprise 9 entries, including the IRGC, Israeli occupation forces, US CENTCOM, and the Lebanese Army. <strong>Media organizations<\/strong> account for 5 entries, notably Iran24 (degree 7,914) which ranks second overall — an unusually high centrality for a media actor. <strong>Civilian groups<\/strong> appear 4 times (Israelis, Palestinians, Iranians, Israeli settler), with Israelis holding the highest degree in the entire corpus. The remaining entries include one religious militia (Hezbollah), one rebel group (Hamas), and two unattributed actors (Donald Trump and Sheikh Naim Qassem). The presence of Hezbollah at degree 4,524 — higher than most state actors — underscores the significant network position of non-state armed groups in this corpus.<\/p><h5>Notable Structural Observations<\/h5><p>Several patterns stand out in the centrality rankings. First, the Israel–Iran–Lebanon axis dominates the network core: Israeli-affiliated and Iranian-affiliated actors together account for 21 of the top 50 entries, and Hezbollah — a Lebanese non-state actor — ranks fourth overall. Second, media organizations occupy surprisingly central positions; Iran24 (degree 7,914) and Ismaili (degree 2,047) both rank above most state and military actors ion of actor.broker_betweenness (run_id 1311187c0cd64931b09f5a7abe6c77e1, version 1.0.0), which computed betweenness centrality for the top 20 actors in a relationship network stored in Neo4j. The method used parameters top_n=20, max_nodes=500, max_edges=5000, and no relation_filter. The full node list (20 nodes with betweenness scores, canonical names where available, actor types, and country affiliations) was read. The edge list was partially read but was TRUNCATED due to token budget limits — the links array in the data payload was cut off mid-stream, so only a subset of the full edge set was available for analysis. The figure_spec in the metadata contains the complete node and edge data, but the data section provided to this report was truncated. Analysts should consult the full export (JSON or GraphML) for complete edge-level analysis.<\/p><h5>Top Broker Betweenness Actors<\/h5><p>The <code>actor.broker_betweenness<\/code> method identified the 20 actors with the highest broker betweenness centrality in the relationship network as of 31 August 2026. Betweenness centrality measures how often an actor lies on the shortest path between other pairs of actors — in effect, how much control or brokerage power a given actor has over information or resource flows in the network.<\/p><p>The top-ranked actor by a wide margin is node <code>2670c1dcd9a941afa6ef590227c878b6<\/code> with a betweenness score of <strong>0.319382<\/strong> — more than double the next-highest actor. This node carries no canonical name in the data provided, but its size attribute (4, the largest) and its centrality suggest it is a dominant hub in the network. The edges involving this node span nearly every relationship type in the dataset, including OPPOSED_TO, ALLIED_WITH, PROVIDES_MILITARY_AID_TO, NEGOTIATES_WITH, DIPLOMATIC_REPRESENTATION, MEDIATES_BETWEEN, COMMANDS, DEPLOYS, SUPPLIES_WEAPONS_TO, FUNDS, PROVIDES_SANCTUARY_TO, and COORDINATES_HUMANITARIAN_WITH. This actor is connected to virtually every other high-betweenness node in the top 20.<\/p><p>The second-ranked actor is node <code>d321a06af0e546edb0059915954d224a<\/code> with a betweenness of <strong>0.129217<\/strong> (size 2). Like the top node, it lacks a canonical name in the provided data, but it also appears as a target or source in a very large number of edges, including OPPOSED_TO, ALLIED_WITH, SUPPLIES_WEAPONS_TO, PROVIDES_MILITARY_AID_TO, NEGOTIATES_WITH, DIPLOMATIC_REPRESENTATION, SUBORDINATE_TO, and ECONOMICALLY_DEPENDENT_ON. The relationship between these two unnamed nodes is itself multi-faceted: the edge list shows they are connected by ALLIED_WITH, OPPOSED_TO, PATRON_OF, PROVIDES_MILITARY_AID_TO, NEGOTIATES_WITH, DIPLOMATIC_REPRESENTATION, MEDIATES_BETWEEN, SUPPLIES_WEAPONS_TO, SHARES_INTELLIGENCE_WITH, GUARANTOR_OF, DEPLOYS, COORDINATES_HUMANITARIAN_WITH, COMMANDS, ECONOMICALLY_DEPENDENT_ON, PROVIDES_SANCTUARY_TO, and FUNDS edges — a remarkably dense and contradictory set of ties suggesting a complex, multi-dimensional relationship.<\/p><h5>Named Actors and Their Brokerage Roles<\/h5><p>Among the named actors in the top 20, several stand out:<\/p><ul><li><strong>Donald Trump<\/strong> (USA, actor_type: unattributed) — betweenness <strong>0.07827<\/strong>, the highest among named actors. The edge data shows Trump is connected to both unnamed hub nodes and to a wide range of other actors through NEGOTIATES_WITH, OPPOSED_TO, ALLIED_WITH, COMMANDS, DEPLOYS, MEDIATES_BETWEEN, GUARANTOR_OF, PATRON_OF, and DIPLOMATIC_REPRESENTATION edges. Trump also has a self-referencing NEGOTIATES_WITH edge (confidence 0.3), which may reflect internal diplomatic positioning.<\/li><li><strong>Hamas<\/strong> (PSE, rebel_group) — betweenness <strong>0.069483<\/strong>. Hamas has an extensive edge set including OPPOSED_TO relationships with many actors, COMMANDS edges to subordinate entities, ALLIED_WITH ties, NEGOTIATES_WITH, and PROVIDES_MILITARY_AID_TO. Hamas is allied with both unnamed hub nodes and opposed to many state and non-state actors.<\/li><li><strong>Islamic Revolutionary Guard Corps<\/strong> (IRN, military) — betweenness <strong>0.067721<\/strong>. The IRGC has one of the densest edge sets in the visible data, with dozens of OPPOSED_TO edges, multiple COMMANDS relationships to subordinate units, SUBORDINATE_TO ties to Iranian state actors, and connections including PROVIDES_MILITARY_AID_TO, SUPPLIES_WEAPONS_TO, DEPLOYS, FUNDS, ALLIED_WITH, and COORDINATES_HUMANITARIAN_WITH.<\/li><li><strong>Node 5cfd97a3fc30400a955ef68e16d6e752<\/strong> — betweenness <strong>0.073183<\/strong>. This unnamed actor is the fourth-highest overall and appears as a target in a very large number of edges, particularly OPPOSED_TO, NEGOTIATES_WITH, ALLIED_WITH, SUBORDINATE_TO, and DIPLOMATIC_REPRESENTATION. Its high betweenness suggests it serves as a major intermediary.<\/li><li><strong>Node 27d1f2b0bec84d96a528e1d542eaa77c<\/strong> — betweenness <strong>0.068449<\/strong>. This unnamed actor has an exceptionally large number of OPPOSED_TO edges (dozens visible in the truncated data), along with PROVIDES_MILITARY_AID_TO, PROVIDES_SANCTUARY_TO, COMMANDS, DEPLOYS, and ALLIED_WITH relationships. The sheer volume of oppositional ties suggests this actor is a central antagonist in the network.<\/li><li><strong>Iranian Ministry of Foreign Affairs<\/strong> (IRN, government) — betweenness <strong>0.025997<\/strong>. The Iranian MFA has numerous NEGOTIATES_WITH, DIPLOMATIC_REPRESENTATION, OPPOSED_TO, COORDINATES_HUMANITARIAN_WITH, and MEDIATES_BETWEEN edges, reflecting its diplomatic role. It is opposed to the IRGC (its own military), which is notable.<\/li><li><strong>Saudi Arabia<\/strong> (SAU, state) — betweenness <strong>0.021508<\/strong>. Saudi Arabia has edges including OPPOSED_TO (notably against Ansarallah and the IRGC), ALLIED_WITH, PROVIDES_MILITARY_AID_TO, FUNDS, PATRON_OF, NEGOTIATES_WITH, MEDIATES_BETWEEN, and DIPLOMATIC_REPRESENTATION.<\/li><li><strong>Ansarallah<\/strong> (YEM, rebel_group) — betweenness <strong>0.020453<\/strong>. Ansarallah has many OPPOSED_TO edges, several ALLIED_WITH ties, and connections including SUPPLIES_WEAPONS_TO, PROVIDES_MILITARY_AID_TO, NEGOTIATES_WITH, and COORDINATES_HUMANITARIAN_WITH.<\/li><li><strong>Lebanese government<\/strong> (LBN, government) — betweenness <strong>0.016443<\/strong>, a relatively lower brokerage position.<\/li><\/ul><h5>Network Structure and Relationship Types<\/h5><p>The edge data (partially visible before truncation) reveals a rich multi-relational network. The relationship types observed include:<\/p><ul><li><strong>Conflict/opposition<\/strong>: OPPOSED_TO is the most frequent edge type, with many actors holding simultaneous OPPOSED_TO and ALLIED_WITH edges to the same target — a pattern especially visible for the two unnamed hub nodes.<\/li><li><strong>Military support<\/strong>: PROVIDES_MILITARY_AID_TO, SUPPLIES_WEAPONS_TO, DEPLOYS, COMMANDS, and TRAINS edges create a military patronage layer.<\/li><li><strong>Diplomatic engagement<\/strong>: NEGOTIATES_WITH, DIPLOMATIC_REPRESENTATION, MEDIATES_BETWEEN, GUARANTOR_OF, and RECOGNISES edges form a diplomatic layer.<\/li><li><strong>Economic/material support<\/strong>: FUNDS, ECONOMICALLY_DEPENDENT_ON, and PROVIDES_SANCTUARY_TO edges.<\/li><li><strong>Institutional<\/strong>: HAS_VETO_POWER_IN, VOTES_WITH, SUCCEEDED_BY, MERGED_WITH, TRANSFERRED_TO.<\/li><li><strong>Cooperation<\/strong>: ALLIED_WITH, SHARES_INTELLIGENCE_WITH, COORDINATES_HUMANITARIAN_WITH, COMPETES_WITH.<\/li><li><strong>Hierarchy<\/strong>: SUBORDINATE_TO, COMMANDS, PATRON_OF.<\/li><\/ul><p>A striking pattern is the prevalence of <strong>contradictory simultaneous edges<\/strong> — for example, the two unnamed hub nodes are connected by both ALLIED_WITH and OPPOSED_TO edges, and several actors have both PROVIDES_MILITARY_AID_TO and OPPOSED_TO edges to the same target. This suggests the network captures relationships across different time periods or contexts, or reflects genuinely ambivalent relationships.<\/p><p><strong>Important caveat<\/strong>: The edge list was truncated due to token budget limits. The analysis above is based on the portion of edges that was visible. The full edge set (available in the JSON or GraphML export) likely contains additional relationships that could alter the betweenness rankings or reveal additional structural patterns. Analysts seeking complete edge-level analysis should consult the full export file.<\/p><h5>Analytical Observations and Caveats<\/h5><p>The betweenness centrality distribution is highly skewed. The top node (0.319) accounts for a disproportionate share of total brokerage, and the top two nodes together (0.319 + 0.129 = 0.448) capture roughly 45% of the cumulative betweenness across the top 20. This indicates a <strong>hub-and-spoke structure<\/strong> where a small number of actors mediate the majority of shortest paths.<\/p><p>The named actors with the highest brokerage — Donald Trump, Hamas, the IRGC, and the unnamed nodes 5cfd97a3fc30400a955ef68e16d6e752 and 27d1f2b0bec84d96a528e1d542eaa77c — are all actors deeply embedded in Middle East conflict networks. Their high betweenness reflects their positions at the intersection of multiple conflict axes (Israel-Palestine, Iran-Saudi Arabia, Yemen, Lebanon) and multiple relationship modalities (military, diplomatic, economic).<\/p><p>The lower-betweenness named actors (Saudi Arabia, Ansarallah, Lebanese government, Iranian MFA) tend to be more specialized in their relationship profiles — Saudi Arabia in patronage and mediation, Ansarallah in opposition and alliance, the Lebanese government in negotiation and subordination.<\/p><p>The two unnamed high-betweenness nodes (2670c1dcd9a941afa6ef590227c878b6 and d321a06af0e546edb0059915954d224a) are critical to understanding this network. Their identities would be the most important next step for the analyst — resolving these nodes’ canonical names would clarify whether the network’s brokerage is concentrated in state actors, non-state armed groups, or international organizations.<\/p><p class=\"pb-ro-pv\">Copilot provenance: turn <code>turn-bq6Y2vfSGh7cyaMJ<\/code> · model deepseek/deepseek-v4-flash-0731 · prompt v1; executor run ids: 1311187c0cd64931b09f5a7abe6c77e1.<\/p><\/div><p style=\"font-size: 13.5px; line-height: 23px; margin: 12px 0 0; padding-left: 14px; border-left: 1px solid var(--color-accent); color: #b3acd0;\">Envelope warnings — <code>calibration_open<\/code>: actor.broker_betweenness results are indicative only: the current graph projection has thin edge density. Betweenness scores will improve significantly once a higher-volume feed is ingested. <code>truncated_by_limit<\/code>: Node result was truncated at max_nodes=500; edge result was truncated at max_edges=5000.<\/p><p style=\"margin: 10px 0 0;\"><span class=\"pb-chip-b\">actor.broker_betweenness · 2026-08-31 · run-2026-08-31-012a4398 · confidence: none published (Tier B raw method) · Tier B<\/span><\/p><\/div>\n    <\/details>\n    <details>\n      <summary>actor.community_detect <span class=\"pb-tier-b\">Tier B · Exploratory — uncalibrated, directional only<\/span><\/summary>\n      <div style=\"padding: 16px;\"><img data-src=\"figures/actor__community_detect.png\" alt=\"actor.community_detect\" style=\"display: block; width: 100%; height: auto; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><p style=\"font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; line-height: 19px; margin: 12px 0 0; color: #8f86bd;\">Result shape: nodes 1,767 rows; links 3,088 rows · rendered mechanically from the saved run output<\/p><div class=\"pb-ro\"><p class=\"pb-ro-k\">Copilot insight readout · verbatim<\/p><h4>Actor Community Detection: Mapping Power Centers, Proxy Networks, and Diplomatic Hubs in the Middle East and Beyond<\/h4><p class=\"pb-ro-d\">Data basis: This report is based on a single method execution: actor.community_detect (v1.0.0, run_id 50f65f270d124708949b97b4cbc0fac6), which performed community detection on the actor relationship graph stored in Neo4j as of 2026-08-31. The method used default resolution (1.0) with a cap of 500 nodes and 5000 edges. The full figure_spec contained hundreds of nodes and thousands of edges (links), but the data payload was truncated due to token budget limits — the nodes list was cut off mid-entry and the links list was also truncated. The analysis below is based on the portion of the data that was available, which includes a substantial sample of nodes across all major clusters and a large sample of edges covering the primary relationship types.<\/p><h5>Overview of the Actor Community Structure<\/h5><p>The community detection method identified a large, multi-cluster actor network spanning the Middle East, Europe, North America, and East Asia. The graph includes state actors, government bodies, military organizations, rebel groups, religious and political militias, NGOs, media organizations, and civilian groups. Clusters range from 0 to at least 157, indicating a highly fragmented landscape with many small, tightly connected sub-communities alongside several large hubs. The largest and most interconnected clusters appear to be clusters 0, 1, 5, 6, 7, 8, 9, and 10, which together encompass the major power centers of Iran, Israel, the United States, and their respective allied and opposed networks.<\/p><h5>Major Power-Center Clusters<\/h5><p>Several clusters stand out as major power centers. <strong>Cluster 4<\/strong> is dominated by Iranian security actors, including the Islamic Revolutionary Guard Corps (IRGC), the Islamic Republic of Iran Army, the Supreme Leader’s Representation in the IRGC, and IRGC-affiliated media. This cluster also includes Israeli intelligence and military actors, suggesting a tightly coupled adversarial relationship. <strong>Cluster 5<\/strong> centers on the Israel–Palestine–Lebanon conflict axis, containing Hamas, the Israeli occupation state, Lebanese resistance (Hezbollah-aligned), Palestinian Islamic Jihad, and various Palestinian militant battalions. <strong>Cluster 6<\/strong> is a broad Iranian governmental and military cluster, including the Chinese government, Khatam headquarters, the US European Command, and Bahrain’s Foreign Ministry — reflecting Iran’s diplomatic and military reach. <strong>Cluster 9<\/strong> functions as an international diplomatic hub, containing Jordan, Saudi Arabia, Qatar, Sudan, Djibouti, Ansarallah (Houthis), and various international organizations and NGOs. <strong>Cluster 1<\/strong> is a US domestic politics cluster, including the US Congress, AIPAC, the Democratic Party, Donald Trump, and Israeli diplomatic representation in the US.<\/p><h5>Relationship Patterns and Edge Types<\/h5><p>The edge data reveals a rich typology of relationships. The most common edge types include <strong>OPPOSED_TO<\/strong> (adversarial relationships), <strong>ALLIED_WITH<\/strong>, <strong>COMMANDS/SUBORDINATE_TO<\/strong> (hierarchical military and governmental structures), <strong>NEGOTIATES_WITH<\/strong> and <strong>MEDIATES_BETWEEN<\/strong> (diplomatic channels), <strong>PROVIDES_MILITARY_AID_TO<\/strong> and <strong>SUPPLIES_WEAPONS_TO<\/strong> (material support flows), and <strong>FUNDS<\/strong> (financial relationships). Key patterns include: (1) Iran’s IRGC (cluster 4) commands, funds, and supplies weapons to a wide network of proxy forces including Hezbollah, Hamas, Palestinian Islamic Jihad, and Yemeni National Resistance forces; (2) The United States maintains extensive military aid and alliance relationships, particularly with Israel, and deploys forces across the region; (3) Qatar emerges as a major mediator, negotiating with and between Israel, Hamas, Iran, and the United States; (4) Israel’s military command structure is deeply hierarchical, with numerous brigades and units subordinate to central command; (5) A dense web of opposition relationships connects Israeli actors to Palestinian, Lebanese, Iranian, and Yemeni actors, forming the core conflict axis of the graph.<\/p><h5>Regional Conflict and Diplomatic Subsystems<\/h5><p>The community detection reveals several distinct regional conflict and diplomatic subsystems. The <strong>Levant conflict subsystem<\/strong> (clusters 5, 8, 15) links Israeli military brigades, Palestinian militant groups, Lebanese government and resistance actors, and Hezbollah’s political wing. The <strong>Iranian proxy network<\/strong> (clusters 4, 6, 10, 11) connects the IRGC, Iranian conventional military, Iranian Foreign Ministry, and Tehran provincial government to proxy forces across the region. The <strong>Gulf diplomatic subsystem<\/strong> (cluster 9) brings together Saudi Arabia, Qatar, Jordan, the UAE, and international organizations in mediation and humanitarian coordination roles. The <strong>US domestic politics subsystem<\/strong> (cluster 1) shows how American legislative actors, lobbying groups, and political parties relate to Israeli diplomatic representation and Middle East policy debates. The <strong>European subsystem<\/strong> (clusters 3, 13) includes the UK government, Polish government, Metropolitan Police, and various European civilian groups engaged in protest, humanitarian, and diplomatic activities related to the conflict.<\/p><h5>Key Bridge Actors and Structural Holes<\/h5><p>Several actors function as critical bridges between otherwise disconnected clusters. <strong>Qatar<\/strong> (cluster 9) maintains negotiation, mediation, and diplomatic representation relationships with Israel, Iran, Hamas, the United States, and Lebanon, making it one of the most connected nodes in the graph. <strong>The United States<\/strong> (spanning clusters 1, 4, 9, 16) connects domestic political actors to military deployments, intelligence sharing, and diplomatic mediation across the region. <strong>Iran’s IRGC<\/strong> (cluster 4) bridges the Iranian governmental system to proxy forces in Lebanon, Palestine, Yemen, and Iraq through command, funding, and weapons supply relationships. <strong>Hezbollah/Lebanese resistance<\/strong> (cluster 5/15) connects the Iranian proxy network to the Levant conflict subsystem and the Lebanese domestic political system. The high number of small clusters (many with only 1–2 members) suggests numerous peripheral actors — individuals, specific military units, courts, and local organizations — that attach to the network through single relationships to larger hub actors.<\/p><p class=\"pb-ro-pv\">Copilot provenance: turn <code>turn-3GvU3T4Y_1rsXEOj<\/code> · model deepseek/deepseek-v4-flash-0731 · prompt v1; executor run ids: 50f65f270d124708949b97b4cbc0fac6.<\/p><\/div><p style=\"font-size: 13.5px; line-height: 23px; margin: 12px 0 0; padding-left: 14px; border-left: 1px solid var(--color-accent); color: #b3acd0;\">Envelope warnings — <code>calibration_open<\/code>: actor.community_detect results are indicative only: the current graph projection has thin edge density. Community structure will improve significantly once a higher-volume feed is ingested. <code>truncated_by_limit<\/code>: Node result was truncated at max_nodes=500; edge result was truncated at max_edges=5000.<\/p><p style=\"margin: 10px 0 0;\"><span class=\"pb-chip-b\">actor.community_detect · 2026-08-31 · run-2026-08-31-eac8a9d1 · confidence: none published (Tier B raw method) · Tier B<\/span><\/p><\/div>\n    <\/details>\n    <details>\n      <summary>actor.dyad_map <span class=\"pb-tier-b\">Tier B · Exploratory — uncalibrated, directional only<\/span><\/summary>\n      <div style=\"padding: 16px;\"><img data-src=\"figures/actor__dyad_map.png\" alt=\"actor.dyad_map\" style=\"display: block; width: 100%; height: auto; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><p style=\"font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; line-height: 19px; margin: 12px 0 0; color: #8f86bd;\">Result shape: nodes 31 rows; links 50 rows · rendered mechanically from the saved run output<\/p><div class=\"pb-ro\"><p class=\"pb-ro-k\">Copilot insight readout · verbatim<\/p><h4>Actor Dyad Network — June 2026: US-Iran Media and Diplomatic Hubs<\/h4><p class=\"pb-ro-d\">Data basis: This report is based on a single method execution of actor.dyad_map (v1.0.0, run_id 98882a13a0584cb69899ffe549e520bb) covering the event window of June 1–30, 2026. The method queried the neo4j store and returned a force-directed network graph of 31 actor nodes and 50 dyad edges, where each edge represents two actors co-appearing in at least one shared event during the window. Parameters: min_shared_events=1, top_n=50, max_nodes=200, max_edges=1000, max_events=10000. The returned node and edge counts are well within the configured limits, so no truncation or sampling occurred. Data is current as of 2026-08-31.<\/p><h5>Network Overview: Two Hubs Dominate the June 2026 Dyad Landscape<\/h5><p>The dyad map for June 2026 is dominated by two hub nodes: the <strong>United States<\/strong> (state actor) and <strong>Iran24<\/strong> (an Iranian media organization). The US–Iran24 dyad carries 943 shared events — nearly four times the next-largest edge — indicating that Iran24 was an extremely prolific source of reporting or commentary involving the United States during this period. This single edge likely reflects intensive media coverage of US-Iran dynamics rather than direct state-to-media diplomatic engagement.<\/p><p><strong>Donald Trump<\/strong> sits as the third major hub, with 234 shared events alongside Iran24 and 232 alongside the United States. The near-parity of these two counts suggests Trump was a central figure in US-Iran-related events throughout June 2026, appearing in contexts that also involved both the US government and Iranian media simultaneously.<\/p><p>The <strong>International Atomic Energy Agency (IAEA)<\/strong> forms a notable triangle with both hubs: 46 shared events with the United States and 46 confrontation.<\/li><li><strong>Hamas<\/strong> also shares 13 events with Iran24 and 10 with the United States.<\/li><li><strong>Israel Katz<\/strong> (Israeli government) shares 9 events with the US.<\/li><li><strong>Lebanese government<\/strong> and <strong>Lebanese President Joseph Aoun<\/strong> both connect to the US hub (21 and 10 events respectively) and to Iran24 (9 each).<\/li><\/ul><p>The Israeli sub-cluster is less densely connected to the main US/Iran24 hubs than the Iranian government cluster, suggesting that Israeli-related events in June 2026 were more localized or episodic rather than forming a continuous high-volume narrative thread.<\/p><h5>Regional and International State Actors<\/h5><p>Several regional and international states appear as mid-tier nodes connected primarily to the US hub:<\/p><ul><li><strong>Saudi Arabia<\/strong>: 27 shared events with the US, 23 with Iran24 — the strongest Gulf state dyad.<\/li><li><strong>Bahrain<\/strong>: 17 with the US, 11 with Iran24.<\/li><li><strong>Jordan<\/strong>: 9 with the US.<\/li><li><strong>China<\/strong>: 16 with the US, 17 with Iran24 — a notable non-Middle-East actor with balanced presence on both hubs.<\/li><li><strong>Germany<\/strong> and <strong>Italy<\/strong>: 13 each with the US.<\/li><li><strong>Switzerland<\/strong>: 10 with the US, 8 with Iran24.<\/li><\/ul><p>The <strong>United States Congress<\/strong> (8 shared events with the US) and <strong>US Vice President<\/strong> (26 with the US, 21 with Iran24) and <strong>US Secretary of State Marco Rubio<\/strong> (21 with the US, 9 with Iran24) appear as domestic US government sub-nodes, indicating legislative and executive branch activity was captured in the event corpus.<\/p><p><strong>The Lancet<\/strong> (a US-affiliated media organization) shares 17 events with the US and 13 with Iran24, and 12 with Donald Trump — suggesting a health- or casualty-related publication event that intersected with political reporting.<\/p><h5>Structural  27, and 24 respectively — all flagged by the method. On June 24, the transit count of 44 represented a deviation of +39 above a baseline median of just 5. June 25 was nearly identical at 43 transits (deviation +38). June 29 saw a secondary spike of 24 transits (deviation +18, also flagged). In total, seven days were flagged across the month: June 18, 20, 24, 25, 26, 27, and 29. The flagged days cluster in the latter third of the month, suggesting a sustained surge rather than isolated daily spikes. By June 30, volumes had declined to 14 transits, which remained above the rising baseline median of 6.5 but was not flagged.<\/p><h5>Baseline Drift and Pattern Interpretation<\/h5><p>The trailing 28-day median baseline evolved from approximately 2–3 transits in early June to 6–6.5 by month’s end, reflecting the inclusion of the late-June surge in the rolling window. This means the baseline itself was rising during the anomaly period, yet deviations remained large enough to trigger flags through June 27 and again on June 29. The early-month low-volume period (June 1–14) produced several negative deviations — most notably June 5 and June 13, both at 0 transits against baselines of 4.0 and 2.5 respectively — but none were flagged, indicating the method’s flagging threshold is asymmetric or oriented toward positive deviations. The transition from suppressed activity in the first half to elevated activity in the second half is the defining feature of this month’s Hormuz transit profile.<\/p><p class=\"pb-ro-pv\">Copilot provenance: turn <code>turn-cZKB6CdJdyIEvwWw<\/code> · model deepseek/deepseek-v4-flash-0731 · prompt v1; executor run ids: 27382fd02b8d485cb2d3babf88ffbfcc.<\/p><\/div><p style=\"font-size: 13.5px; line-height: 23px; margin: 12px 0 0; padding-left: 14px; border-left: 1px solid var(--color-accent); color: #b3acd0;\">Envelope warning <code>publication_lag<\/code>: PortWatch data is published with an approximately 6-day lag; this series quantifies and corroborates disruption and is not a first-alert signal (the event feeds carry that role).<\/p><p style=\"margin: 10px 0 0;\"><span class=\"pb-chip-b\">maritime.chokepoint_transit_series · 2026-08-31 · run-2026-08-31-03d88782 · confidence: none published (Tier B raw method) · Tier B<\/span><\/p><\/div>\n    <\/details>\n    <details>\n      <summary>airspace.zone_density_series <span class=\"pb-tier-b\">Tier B · Exploratory — uncalibrated, directional only<\/span><\/summary>\n      <div style=\"padding: 16px;\"><img data-src=\"figures/airspace__zone_density_series.png\" alt=\"airspace.zone_density_series\" style=\"display: block; width: 100%; height: auto; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><p style=\"font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; line-height: 19px; margin: 12px 0 0; color: #8f86bd;\">Result shape: series 29 rows; zone hormuz_corridor; category all; baseline 29 rows · rendered mechanically from the saved run output<\/p><div class=\"pb-ro\"><p class=\"pb-ro-k\">Copilot insight readout · verbatim<\/p><h4>Hormuz Corridor Air Traffic Density Surge — June 2026<\/h4><p class=\"pb-ro-d\">Data basis: This report is based on a single method execution: airspace.zone_density_series (run_id 57be9314a31f44ae96cb580300563f10), which returned a daily time series of distinct aircraft and position reports for the hormuz_corridor zone from June 1 through June 30, 2026. The method used a 28-day trailing median baseline to compute deviations and flag anomalous days. All 29 observation days (June 11 is absent from the series) were fully included in this prompt; no data was truncated or omitted.<\/p><h5>Sustained Air Traffic Surge in the Hormuz Corridor, June 2026<\/h5><p>The Hormuz corridor experienced a dramatic and sustained surge in air traffic density during June 2026. The first half of the month (June 1–13) was characterized by very low activity, with distinct aircraft counts ranging from 1 to 11 per day and a trailing median baseline hovering around 4–5. Beginning around June 14, activity began climbing sharply. By June 18, the daily distinct aircraft count reached 25 — already five times the trailing median of 4.5 — and the method flagged this day as anomalous.<\/p><p>The surge intensified through the second half of the month. Daily distinct aircraft peaked at 96 on both June 21 and June 24, with sustained high counts of 75–88 in the surrounding days. Position reports followed an even steeper trajectory, rising from a few hundred per day in early June to over 8,200 on June 26 and over 7,600 on June 30. This indicates not only more aircraft entering the corridor but also each aircraft generating far more positional data, consistent with loitering, circuitous routing, or dense stacking within the zone.<\/p><p>The trailing median baseline rose slowly in response — reaching only 18 by June 30 — meaning the observed values remained far above the historical norm for the entire latter half of the month. The method flagged 14 of the last 15 observation days (June 16–29) as anomalous. June 30, despite a deviation of +58, was not flagged, likely because the rising baseline brought it just under the flagging threshold.<\/p><h5>Baseline Deviation and Anomaly Flagging<\/h5><p>The baseline deviation analysis reveals a clear two-phase pattern. In the first phase (June 1–13), deviations were small and mixed in sign, oscillating between -6 and +7.5 relative to a stable median near 4–5. Only June 4 and June 14 were flagged in this period, and both were modest deviations that the method treated as early warning signals.<\/p><p>The second phase (June 16 onward) is defined by large, persistent positive deviations. The deviation grew from +16 on June 16 to +87 on June 21, then remained in the +54 to +86 range through June 29. This is not a transient spike but a structural shift in corridor usage. The fact that the trailing median had only climbed to 18 by June 30 — despite nearly two weeks of elevated counts — underscores how far outside the historical envelope this activity sits.<\/p><p>Position report volume provides additional context. In early June, the ratio of position reports to distinct aircraft was highly variable (e.g., 4 reports for 1 aircraft on June 7, but 324 reports for 4 aircraft on June 8). From June 19 onward, this ratio stabilized at roughly 60–100 reports per aircraft per day, suggesting consistent, high-frequency tracking of a large number of airframes operating within or transiting the corridor.<\/p><p class=\"pb-ro-pv\">Copilot provenance: turn <code>turn-whtlPKdDhPUMTFWn<\/code> · model deepseek/deepseek-v4-flash-0731 · prompt v1; executor run ids: 57be9314a31f44ae96cb580300563f10.<\/p><\/div><p style=\"font-size: 13.5px; line-height: 23px; margin: 12px 0 0; padding-left: 14px; border-left: 1px solid var(--color-accent); color: #b3acd0;\">Envelope warning <code>coverage_index_not_census<\/code>: Flight-density coverage is crowd-sourced (ADS-B receivers) — an index of activity, not a census. An absent or zero value means no receiver coverage for that zone, NOT an absence of flights; do not read a missing/zero zone as no activity.<\/p><p style=\"margin: 10px 0 0;\"><span class=\"pb-chip-b\">airspace.zone_density_series · 2026-08-31 · run-2026-08-31-7de65a2e · confidence: none published (Tier B raw method) · Tier B<\/span><\/p><\/div>\n    <\/details>\n    <details>\n      <summary>airspace.density_map <span class=\"pb-tier-b\">Tier B · Exploratory — uncalibrated, directional only<\/span><\/summary>\n      <div style=\"padding: 16px;\"><img data-src=\"figures/airspace__density_map.png\" alt=\"airspace.density_map\" style=\"display: block; width: 100%; height: auto; border: 1px solid var(--color-neutral-700); border-radius: 12px;\"><p style=\"font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; line-height: 19px; margin: 12px 0 0; color: #8f86bd;\">Result shape: features 2,988 rows; unmapped_count 0 · rendered mechanically from the saved run output<\/p><div class=\"pb-ro\"><p class=\"pb-ro-k\">Copilot insight readout · verbatim<\/p><h4>Airspace Density Map — Distinct Aircraft Activity Across the Middle East and Eastern Mediterranean, June 2026<\/h4><p class=\"pb-ro-d\">Data basis: This report is based on a single method execution: run_id 9eb4d0c3b81642599ca0940b0c58f7e3, method airspace.density_map v1.0.0, covering the date window 2026-06-01 through 2026-06-30 with category ‘all’ and weighting by distinct_aircraft. The data was read from a SQLite store and rendered as a Leaflet map_points visualization. The full GeoJSON FeatureCollection contained hundreds of grid-zone point features spanning longitudes ~33–62 and latitudes ~22–40. Due to token budget limits, the data payload was truncated; the analysis below is based on the complete metadata and the portion of feature data that was successfully delivered, which includes the highest-weight zones and a substantial sample of mid- and low-weight zones. Lower-weight zones (weight &lt; ~3,500) may be underrepresented in the visible data, though their presence is confirmed in the full figure_spec.<\/p><h5>Overview of Airspace Density Across the Region<\/h5><p>The airspace.density_map method produced a geospatial point map of distinct aircraft counts across a grid covering the broader Middle East and Eastern Mediterranean region for June 2026. Each point represents a 0.25-degree grid zone, with the weight value indicating the number of distinct aircraft observed in that zone during the month. The map spans from the Eastern Mediterranean (longitude ~33) eastward to the Gulf of Oman and beyond (longitude ~62), and from approximately latitude 22 to latitude 40. This coverage includes the Arabian Peninsula, the Levant, Turkey, Cyprus, Iran, and the Persian Gulf corridor.<\/p><h5>Highest-Density Zones: UAE and Persian Gulf Corridor<\/h5><p>The single highest-density zone in the dataset is centered at longitude 55.25, latitude 25.0 (zone g_25.00_55.25), with a weight of 10,428 distinct aircraft. This zone corresponds to the Dubai area in the United Arab Emirates. The immediately adjacent zones reinforce this concentration: zone g_25.25_55.25 (8,974 aircraft) and zone g_25.00_55.50 (8,170 aircraft) sit directly north and east, forming a dense cluster across the Dubai–Abu Dhabi corridor. Further east, zone g_25.00_55.75 recorded 6,574 aircraft, and zone g_24.25_54.50 recorded 6,204, indicating that the UAE’s airspace sustains the highest overall traffic volume in the mapped region.<\/p><h5>Secondary Clusters: Riyadh and Eastern Saudi Arabia<\/h5><p>A second major concentration appears around Riyadh, Saudi Arabia. Zone g_24.75_46.50 (longitude 46.5, latitude 24.75) recorded 7,525 distinct aircraft, making it the fourth-highest zone overall. Neighboring zones g_24.50_46.50 (5,210) and g_24.75_46.25 (4,895) confirm a broad cluster over central Saudi Arabia. To the east, a separate cluster around the Saudi Eastern Province and Bahrain/Qatar area appears at longitude 49–51, latitude 26–26.5, with zones such as g_26.25_49.75 (6,707), g_26.25_51.00 (5,443), and g_26.50_51.00 (4,862). This eastern Saudi corridor connects the Gulf states to northbound and southbound traffic routes.<\/p><h5>Eastern Mediterranean and Cyprus Corridor<\/h5><p>The Eastern Mediterranean shows a notable density cluster around Cyprus and the Turkish coast. Zones g_35.75_33.75 (6,822) and g_35.75_34.00 (6,820) are nearly identical in weight and sit adjacent to each other at latitude 35.75, indicating heavy traffic through this corridor. Nearby zones at latitude 36.0 — g_36.00_33.75 (5,801) and g_36.00_33.50 (4,694) — extend the cluster northward. This area likely reflects commercial air traffic between Europe, Turkey, and the Middle East converging over the Eastern Mediterranean.<\/p><h5>Turkey–Syria Border Region<\/h5><p>A broad, high-density cluster spans the Turkey–Syria border region, centered roughly at longitude 37–39, latitude 32–33. The top zones in this area include g_32.75_37.75 (6,019), g_32.75_38.00 (6,016), g_32.00_34.75 (6,003), and g_32.75_38.50 (5,853). Dozens of adjacent zones in the 4,000–5,500 range fill in a contiguous block, suggesting sustained traffic across this region. This may reflect both commercial overflight routes and military aviation activity. The density here is comparable to the Eastern Mediterranean cluster, though spread over a wider geographic area.<\/p><h5>Southern Iran and Gulf of Oman<\/h5><p>Southern Iran and the Gulf of Oman show a moderate-density cluster at longitude 55–59, latitude 22–24. The highest zone in this sub-region is g_23.75_59.25 (5,377), followed by g_23.75_59.50 (4,492) and g_23.75_59.00 (4,463). Zones around longitude 58–59 at latitude 22.5–24.0 range from 2,700 to 3,800, indicating a secondary traffic lane along the Iranian coast and into the Gulf of Oman. This is distinct from the UAE cluster to the west and likely reflects traffic routing through the Strait of Hormuz and along the Iranian coastline.<\/p><h5>Lower-Density and Peripheral Zones<\/h5><p>The dataset includes a long tail of lower-weight zones (weight below 1,000) spread across the periphery of the mapped region, including areas over central Iran (longitude 38–43, latitude 30–40), the Red Sea coast, and remote desert areas. Many of these zones record only 1–5 distinct aircraft for the month. While the token budget prevented full enumeration of all low-weight features, the figure_spec confirms their presence. These sparse zones provide context for the major corridors by delineating the boundaries of regularly trafficked airspace.<\/p><p class=\"pb-ro-pv\">Copilot provenance: turn <code>turn-AVJ0ByjLtTRFIEgu<\/code> · model deepseek/deepseek-v4-flash-0731 · prompt v1; executor run ids: 9eb4d0c3b81642599ca0940b0c58f7e3.<\/p><\/div><p style=\"font-size: 13.5px; line-height: 23px; margin: 12px 0 0; padding-left: 14px; border-left: 1px solid var(--color-accent); color: #b3acd0;\">Envelope warning <code>coverage_index_not_census<\/code>: Flight-density coverage is crowd-sourced (ADS-B receivers) — an index of activity, not a census. An absent or zero value means no receiver coverage for that zone, NOT an absence of flights; do not read a missing/zero zone as no activity.<\/p><p style=\"margin: 10px 0 0;\"><span class=\"pb-chip-b\">airspace.density_map · 2026-08-31 · run-2026-08-31-b51e29b0 · confidence: none published (Tier B raw method) · Tier B<\/span><\/p><\/div>\n    <\/details>\n\n    <p style=\"font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; line-height: 20px; margin: 24px 0 0; color: #8f86bd;\">Every Tier B readout carries the envelope warning <code>snapshot_data<\/code>: computed from a snapshot of the production data root, data as of 2026-08-31T03:32:37Z, snapshot taken 2026-08-31T19:44:29Z. The corpus is fixed and each result is reproducible from that snapshot; it is not a statement about the current state of the live stores.<\/p>\n  <\/section>\n\n  <\/div>\n\n  <footer style=\"max-width: 1060px; margin: 96px auto 0; padding: 28px clamp(20px, 5vw, 56px) 72px; border-top: 1px solid var(--color-divider);\">\n    <p style=\"font-size: 14px; line-height: 24px; margin: 0; max-width: 80ch; color: #a29bc0;\">CIP · The Period Brief · every chip resolves to a method run and sweep journal entry. Chip format: <span class=\"pb-chip\">method · run date · sweep ID · confidence · tier<\/span><\/p>\n    <p style=\"font-size: 14px; line-height: 24px; margin: 12px 0 0; color: #a29bc0;\">Questions or refusals: <a href=\"mailto:founder@mergeseat.com\">founder@mergeseat.com<\/a> · <a href=\"https://mergeseat.com\">mergeseat.com<\/a><\/p>\n  <\/footer>\n<\/div>\n<\/x-dc>\n\n\n<\/body><\/html>"</script>
